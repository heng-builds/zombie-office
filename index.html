const spriteCache=new Map();
function paintRows(x,rows,pal,yOff){for(let r=0;r<rows.length;r++){const row=rows[r];for(let c=0;c<row.length;c++){const ch=row[c];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(c,r+yOff,1,1);}}}}
function paintAt(x,list,pal){for(const [r,row] of list)for(let c=0;c<row.length;c++){const ch=row[c];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(c,r,1,1);}}}
function finishSprite(key,a,rim){
  const w=a.width,h=a.height,x=a.getContext('2d');
  if(rim){const src=x.getImageData(0,0,w,h).data;const o=document.createElement('canvas');o.width=w;o.height=h;const ox=o.getContext('2d');ox.fillStyle=rim;
    for(let r=0;r<h;r++)for(let c=0;c<w;c++){if(src[(r*w+c)*4+3])continue;const n=[[1,0],[-1,0],[0,1],[0,-1]].some(([dc,dr])=>{const cc=c+dc,rr=r+dr;return cc>=0&&rr>=0&&cc<w&&rr<h&&src[(rr*w+cc)*4+3];});if(n)ox.fillRect(c,r,1,1);}
    ox.drawImage(a,0,0);a=o;}
  const b=document.createElement('canvas');b.width=w;b.height=h;const y=b.getContext('2d');y.drawImage(a,0,0);y.globalCompositeOperation='source-in';y.fillStyle='#fff';y.fillRect(0,0,w,h);
  const s={img:a,white:b};spriteCache.set(key,s);return s;
}
function sprite(key,rows,pal){const s=spriteCache.get(key);if(s)return s;const a=document.createElement('canvas');a.width=rows[0].length;a.height=rows.length;paintRows(a.getContext('2d'),rows,pal,0);return finishSprite(key,a,null);}
function zombieSprite(palKey,frame){const key='z_'+palKey+'_'+frame;const c=spriteCache.get(key);if(c)return c;const a=document.createElement('canvas');a.width=12;a.height=14;paintRows(a.getContext('2d'),ZBODY.concat(ZLEGS[frame]),PAL[palKey],0);return finishSprite(key,a,null);}
const gunSprite=id=>sprite('g_'+id,GUNS[id].rows,GUNS[id].pal);
function charKey(ch,outfit,frame,arms){return 'c_'+outfit+'_'+ch.skin+'_'+ch.hair+'_'+ch.hairColor+'_'+ch.face+'_'+frame+(arms?'a':'');}
function charSprite(ch,outfit,frame,arms){
  const key=charKey(ch,outfit,frame,arms);const s=spriteCache.get(key);if(s)return s;
  const o=OUTFITS[outfit],a=document.createElement('canvas');a.width=12;a.height=17;const x=a.getContext('2d');
  const skin=SKINS[ch.skin]||SKINS[1],hairC=HAIR_COLORS[ch.hairColor]||'#1a1a1a';
  const pal={...o.pal,S:skin,H:hairC,E:'#1a1d27',m:'#b5655a'};
  if(o.full){paintRows(x,o.full,pal,0);paintRows(x,LEGS[o.legs][frame],pal,14);return finishSprite(key,a,o.rim||null);}
  if(arms){const sl=o.sleeve==='skin'?skin:(o.pal.C||skin),hd=o.pal.G||skin;x.fillStyle=sl;x.fillRect(1,9,1,4);x.fillRect(10,9,1,4);x.fillStyle=hd;x.fillRect(1,13,1,1);x.fillRect(10,13,1,1);}
  paintAt(x,HEAD,pal);paintAt(x,EYES,pal);
  const f=FACES[ch.face]||FACES.none;paintAt(x,f.rows,{...pal,...(f.pal||{}),B:hairC});
  if(!o.hideHair)paintAt(x,(HAIRS[ch.hair]||HAIRS.short).rows,pal);
  paintRows(x,o.torso,pal,9);paintRows(x,[o.pants||"...PPPPPP..."],pal,13);paintRows(x,LEGS[o.legs][frame],pal,14);
  if(o.face)paintAt(x,o.face,pal);
  if(o.hat)paintAt(x,o.hat,pal);
  return finishSprite(key,a,o.rim||null);
}
const iconCache={};
function toIcon(key,img,scale){if(iconCache[key])return iconCache[key];const c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,c.width,c.height);return iconCache[key]=c.toDataURL();}

const LEVEL_MIGRATE=[0,1,3,5,6,8],LEVEL_MIGRATE3=[0,1,2,3,4,5,7,8,9];
function loadSave(){
  const d=JSON.parse(JSON.stringify(DEFAULT_SAVE));let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
  if(!s||typeof s!=='object')return d;
  const out={...d,...s,settings:{...d.settings,...(s.settings||{})},char:{...d.char,...(s.char||{})}};
  let v=+s.v||1;

const FF={cs:30,w:0,h:0,block:null,dist:null,key:'',t:0,q:null};
function ffBuild(){const g=G;FF.w=Math.ceil(WORLD.w/FF.cs);FF.h=Math.ceil(WORLD.h/FF.cs);const n=FF.w*FF.h;FF.block=new Uint8Array(n);FF.dist=new Int16Array(n);FF.q=new Int32Array(n);

  FF.t-=dt;if(FF.t>0)return;FF.t=.25;const W=FF.w,H=FF.h,D=FF.dist,B=FF.block,Q=FF.q;D.fill(-1);
  let sx=clamp(Math.floor(g.player.x/FF.cs),0,W-1),sy=clamp(Math.floor(g.player.y/FF.cs),0,H-1);
  if(B[sy*W+sx]){let best=-1,bd=1e9;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const x=sx+dx,y=sy+dy;if(x<0||y<0||x>=W||y>=H||B[y*W+x])continue;const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=y*W+x;}}if(best<0)return;sx=best%W;sy=(best/W)|0;}
  let h=0,t=0;Q[t++]=sy*W+sx;D[sy*W+sx]=0;
  while(h<t){const c=Q[h++],cx=c%W,cy=(c/W)|0,dc=D[c]+1;
    for(let k=0;k<4;k++){const nx=cx+(k===0?1:k===1?-1:0),ny=cy+(k===2?1:k===3?-1:0);if(nx<0||ny<0||nx>=W||ny>=H)continue;const ni=ny*W+nx;if(B[ni]||D[ni]>=0)continue;D[ni]=dc;Q[t++]=ni;}}}
function ffAngle(x,y){if(!FF.dist)return null;const W=FF.w,H=FF.h,cx=clamp(Math.floor(x/FF.cs),0,W-1),cy=clamp(Math.floor(y/FF.cs),0,H-1),D=FF.dist;
  let here=D[cy*W+cx];let best=null,bd=here<0?32767:here;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const v=D[ny*W+nx];if(v<0)continue;
    if(dx&&dy&&(D[cy*W+nx]<0||D[ny*W+cx]<0))continue;const vv=v+(dx&&dy?.4:0);if(vv<bd){bd=vv;best=[nx,ny];}}
  if(!best)return null;return Math.atan2(best[1]*FF.cs+FF.cs/2-y,best[0]*FF.cs+FF.cs/2-x);}

    else{const per=Math.max(.08,g.rate),n=Math.ceil(1.2/per);for(let i=0;i<n;i++){const age=((prevT+i*per)%1.2),sp=g.speed/1200*64;const bx=14+gw+age*sp*1.5;if(bx>64)continue;const sy=26+(g.pellets>1?((i%3)-1)*5:0)+Math.sin(i*7)*g.spread*20;x.fillStyle=g.color;x.fillRect(bx,sy,g.kind==='laser'||g.kind==='needle'?8:Math.max(2,g.size*.7),g.kind==='laser'?2:Math.max(2,g.size*.7));}}
  }}
setInterval(drawPreviews,100);
function renderWardrobe(focusId){
  const items=Object.entries(OUTFITS).map(([id,o])=>{const own=save.outfits.includes(id),on=save.outfit===id;return'<div class="item t-'+o.tier+(on?' sel':'')+'"><img src="'+outfitIcon(id)+'" alt="" style="width:60px"><div><h3>'+esc(o.name)+tierTag(o.tier)+'</h3><p>'+esc(o.desc)+'</p></div>'+
    (on?'<span class="tag">穿著中</span>':own?'<button class="btn" data-act="wear" data-arg="'+id+'">換上</button>':'<button class="btn" data-act="buyOutfit" data-arg="'+id+'"'+(save.coins<o.price?' disabled':'')+'><i class="coin"></i>'+o.price+'</button>')+'</div>';}).join('');
  show('<div class="sheet" role="dialog" aria-label="更衣室"><header><h2>更衣室</h2>'+coinTag(save.coins)+'</header><p class="lead">服裝會改變外觀，也帶有能力。一次只能穿一套。</p><div class="list">'+items+'</div><div class="row"><button class="btn ghost" data-act="menu">返回</button></div></div>',focusId?'[data-arg="'+focusId+'"]':null);
}
function renderBadge(first){
  const c=save.char;mode='menu';G=null;controlsUI(false);
  const sw=(list,key,cur)=>list.map(([k,col])=>'<button class="sw'+(String(k)===String(cur)?' on':'')+'" style="--c:'+col+'" data-act="charSet" data-key="'+key+'" data-arg="'+k+'" aria-label="'+key+' '+k+'"></button>').join('');
  const opts=(obj,key,cur)=>Object.entries(obj).map(([k,v])=>'<button class="opt'+(k===cur?' on':'')+'" data-act="charSet" data-key="'+key+'" data-arg="'+k+'">'+esc(v.name)+'</button>').join('');
  show('<div class="badge" role="dialog" aria-label="員工證"><div class="strap">'+(first?'歡迎報到，請製作員工證':'EMPLOYEE ID')+'</div><div class="body"><div><div class="photo"><canvas id="pv" width="120" height="170"></canvas><div class="cap" id="pvcap">'+esc(playerName())+'　'+esc(OUTFITS[save.outfit].name)+'</div></div></div><div>'+
    '<label for="nm">姓名</label><input id="nm" maxlength="12" value="'+esc(c.name)+'" placeholder="社畜" autocomplete="off">'+
    '<label>膚色</label><div class="sws">'+sw(SKINS.map((s,i)=>[i,s]),'skin',c.skin)+'</div>'+
    '<label>髮型</label><div class="sws">'+opts(HAIRS,'hair',c.hair)+'</div>'+
    '<label>髮色</label><div class="sws">'+sw(Object.entries(HAIR_COLORS),'hairColor',c.hairColor)+'</div>'+
    '<label>臉部</label><div class="sws">'+opts(FACES,'face',c.face)+'</div>'+
    '<div class="row"><button class="btn small ghost" data-act="charRandom">隨機</button></div></div></div>'+
    '<div class="foot"><div class="row"><button class="btn'+(first?'':' ghost')+'" data-act="badgeDone">'+(first?'完成報到':'完成')+'</button></div></div></div>','#nm');
  const inp=$('#nm');inp.addEventListener('input',()=>{c.name=inp.value.slice(0,12);$('#pvcap').textContent=playerName()+'　'+OUTFITS[save.outfit].name;persist();});
  drawPreview();
}
function drawPreview(){
  const cvs=$('#pv');if(!cvs)return;const x=cvs.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,cvs.width,cvs.height);
  const fr=Math.floor(previewT*6)%4,spr=charSprite(save.char,save.outfit,fr,true),s=8;x.drawImage(spr.img,(cvs.width-12*s)/2,cvs.height-17*s-10+SINK[fr]*s,12*s,17*s);
}
function renderSettings(){
  const s=save.settings,V=['','小','中','大'];
  const row=(label,on,tAct,vAct,vol)=>'<div class="row" style="margin-top:10px"><button class="btn" data-act="'+tAct+'" style="flex:2">'+label+'：'+(on?'開':'關')+'</button><button class="btn ghost" data-act="'+vAct+'" style="flex:1" '+(on?'':'disabled')+'>音量 '+V[vol]+'</button></div>';
  show('<div class="memo" role="dialog" aria-label="設定"><h2>設定</h2>'+row('配樂',s.music,'toggleMusic','musicVol',s.musicVol)+row('槍聲',s.gun,'toggleGunSfx','gunVol',s.gunVol)+row('其他音效',s.sound,'toggleSound','sfxVol',s.sfxVol)+
    '<p class="hint" style="margin-top:14px">音量按一下會在小、中、大之間循環。</p>'+
    '<button class="btn'+(save.lbConsent?'':' ghost')+'" data-act="toggleLb">上傳成績到排行榜：'+(save.lbConsent?'開':'關')+'</button>'+
    '<button class="btn'+(s.easy?'':' ghost')+'" data-act="toggleEasy">輕鬆模式：'+(s.easy?'開':'關')+'</button><p class="hint" style="margin:6px 0 0">殭屍傷害減 30%、同時在場數量減 20%。不影響金幣和解鎖。</p>'+
    '<button class="btn ghost" data-act="reset">'+(resetArm?'再按一次，清除所有金幣與解鎖':'清除存檔')+'</button><button class="btn ghost" data-act="menu">返回</button></div>');
}
function pauseGame(){if(mode!=='play')return;mode='paused';controlsUI(false);$('#actBtn').classList.add('hidden');MUSIC.duck=.35;musicGain();
  show('<div class="memo" role="dialog" aria-label="暫停"><h2>暫停</h2><p>這局已經賺到 '+Math.floor(G.coins)+' 金幣，現在離開也會帶走。</p><button class="btn" data-act="resume">繼續上班</button><button class="btn ghost" data-act="quit">早退，回主選單</button></div>');}
function resumeGame(){hideScreen();mode='play';controlsUI(true);updateActBtn();last=performance.now();MUSIC.duck=1;musicGain();}
const KILL_TIPS={'離職殭屍':'離職殭屍靠近時會閃紅圈，聽到嗶聲就往旁邊跑。','過勞殭屍':'過勞殭屍走得慢，拉開距離再打，或用穿透型的槍。','實習生殭屍':'實習生跑得快，霰彈槍或便利貼散射槍能一次擋住一群。','開會殭屍':'開會殭屍會丟文件，橫向移動比直線後退更容易閃。','主管跟班':'主管跟班正面擋子彈，繞到側面或上下方再打。','外包的外包':'外包殭屍死後會分裂，用範圍武器一次清掉。','文件攻擊':'紙張攻擊速度不快，看到白色紙片就側移。','退件印章':'紅圈出現後 0.8 秒會蓋章，看到紅圈就離開。','強制更新':'進度條跑滿會爆炸，趁早離開藍色圓圈。'};
function resultExtras(win,quit,tsec,newBest){
  const g=G,parts=[];
  if(win)parts.push('清關時間 '+fmtT(tsec)+(newBest?'　新紀錄！':save.best[g.lv]?'　最佳 '+fmtT(save.best[g.lv]):''));
  else if(!quit){parts.push('被 '+esc(g.killer||'加班')+' 打倒　最多同時面對 '+(g.maxAlive||0)+' 隻　撿到 '+Object.values(g.skills).reduce((a,b)=>a+b,0)+' 個技能');const tip=KILL_TIPS[g.killer]||(g.bosses.length?'魔王出招前都有預警，先看清楚再靠近。':'邊走邊打，不要停在原地讓殭屍圍上來。');parts.push('<span style="color:#4d4424">小提示：'+tip+'</span>');}
  return parts.map(t=>'<p style="margin:0 0 8px">'+t+'</p>').join('');
}
function endRun(win,quit){
  if(!G||G.ended)return;G.ended=true;const lv=G.lv,L=LEVELS[lv];
  if(L.endless){MUSIC.duck=1;setMusic('menu');musicGain();const t=Math.floor(G.time),score=t*10+G.player.kills*5+G.bossKills*500,earned=Math.floor(G.coins)+G.bossKills*100;save.coins+=earned;const best=score>save.bestEndless;if(best)save.bestEndless=score;save.bestEndlessT=Math.max(save.bestEndlessT||0,t);save.bestEndlessK=Math.max(save.bestEndlessK||0,G.player.kills);persist();const run={t,k:G.player.kills,b:G.bossKills};mode='result';controlsUI(false);$('#actBtn').classList.add('hidden');
    show('<div class="memo" role="dialog" aria-label="結算"><h1>加班結束</h1><p>'+esc(playerName())+'　撐了 '+Math.floor(t/60)+' 分 '+(t%60)+' 秒　擊倒 '+G.player.kills+' 隻，主管 '+G.bossKills+' 位</p><p class="pix" style="font-size:22px;margin:0 0 4px">分數 '+score+(best?'　新紀錄！':'')+'</p><p>最佳 '+save.bestEndless+'　本局金幣 +'+earned+(G.bossKills?'（含主管獎金 '+G.bossKills*100+'）':'')+'</p>'+coinTag(save.coins)+'<p id="lbstatus" style="font-size:13px;margin:8px 0 0"></p>'+
      '<button class="btn" data-act="retry">再加班一次</button><button class="btn ghost" data-act="board">看排行榜</button><button class="btn ghost" data-act="menu">回主選單</button></div>');lbAfterRun(run);return;}
  MUSIC.duck=1;setMusic('menu');musicGain();
  const bonus=win?(L.survival?300:120*(lv+1)):0,earned=Math.floor(G.coins)+bonus;
  const tsec=Math.floor(G.time);let newBest=false;
  save.coins+=earned;if(win){if(!save.cleared.includes(lv))save.cleared.push(lv);save.unlocked=Math.max(save.unlocked,Math.min(lv+1,LEVELS.length-1));if(!save.best[lv]||tsec<save.best[lv]){save.best[lv]=tsec;newBest=true;}}
  if(lv===0&&(win||G.player.kills>=10))save.tut=true;
  persist();mode='result';controlsUI(false);$('#actBtn').classList.add('hidden');
  const hasNext=win&&lv+1<LEVELS.length,final=win&&L.rooftop;
  const title=quit?'提早下班':win?(final?'全公司都下班了':'成功下班！'):'被加班吞噬了';
  const msg=final?'董事會也被'+esc(playerName())+'打散了。整棟樓終於安靜下來，但加班永遠不會結束：無限加班模式已解鎖。':win?'這層清乾淨了，'+LEVELS[lv+1].floor+' 已經解鎖。':quit?'今天的進度重置，賺到的金幣已經收進口袋。':'關卡會重置，但買過的槍和衣服都還在。';
  show('<div class="memo" role="dialog" aria-label="結算"><h1>'+title+'</h1><p>'+esc(playerName())+'　'+L.floor+' '+esc(L.name)+'　擊倒 '+G.player.kills+' 隻</p>'+resultExtras(win,quit,tsec,newBest)+(G.smashed?'<p>被 '+esc(G.smashBy)+' 拆掉了 '+G.smashed+' 件辦公室家具。</p>':'')+'<p>'+msg+'</p><p class="pix" style="font-size:18px;margin:0">本局金幣 +'+earned+(bonus?'（含通關獎金 '+bonus+'）':'')+'</p>'+coinTag(save.coins)+
    (hasNext?'<button class="btn" data-act="pickLevel" data-arg="'+(lv+1)+'">'+(LEVELS[lv+1].endless?'進入無限加班':'前往 '+LEVELS[lv+1].floor+' '+esc(LEVELS[lv+1].name))+'</button>':'')+
    '<button class="btn'+(hasNext?' ghost':'')+'" data-act="retry">再打一次 '+L.floor+'</button><button class="btn ghost" data-act="shop">去武器庫</button><button class="btn ghost" data-act="menu">回主選單</button></div>');
}
const ACTIONS={
  menu:renderMenu,levels:()=>{G=null;mode='menu';renderLevels();},shop:()=>{G=null;mode='menu';renderShop();},wardrobe:()=>{G=null;mode='menu';renderWardrobe();},badge:()=>{G=null;mode='menu';renderBadge();},settings:()=>{resetArm=false;renderSettings();},
  pickLevel:a=>{G=null;mode='menu';pendingLv=+a;pickSel=save.loadout.filter(id=>save.guns.includes(id)).slice(0,2);for(const id of save.guns){if(pickSel.length>=2)break;if(!pickSel.includes(id))pickSel.push(id);}renderLoadout();},
  toggleGun:a=>{const k=pickSel.indexOf(a);if(k>=0)pickSel.splice(k,1);else if(pickSel.length<2)pickSel.push(a);else pickSel[1]=a;renderLoadout(a);},
  start:()=>{if(pickSel.length<2)return;save.loadout=pickSel.slice();persist();elevatorTo(pendingLv,()=>startRun(pendingLv,pickSel.slice()));},
  buyGun:a=>{const g=GUNS[a];if(!g||save.guns.includes(a)||save.coins<g.price)return;save.coins-=g.price;save.guns.push(a);persist();sfx('power');renderShop(a);},
  buyOutfit:a=>{const o=OUTFITS[a];if(!o||save.outfits.includes(a)||save.coins<o.price)return;save.coins-=o.price;save.outfits.push(a);save.outfit=a;persist();sfx('power');renderWardrobe(a);},
  wear:a=>{if(!save.outfits.includes(a))return;save.outfit=a;persist();renderWardrobe(a);},
  badgeDone:()=>{save.seenBadge=true;persist();if(LB.pending&&save.lbConsent===null){const r=LB.pending;show('<div class="memo" role="dialog" aria-label="上傳成績"><h2>上傳成績</h2><p>撐了 '+fmtLong(r.t)+'，擊倒 '+r.k+' 隻。</p><p id="lbstatus" style="font-size:13px"></p><button class="btn ghost" data-act="menu">回主選單</button></div>');lbAfterRun(r);return;}renderMenu();},
  charSet:(a,b)=>{const k=b.dataset.key;if(k==='skin')save.char.skin=+a;else save.char[k]=a;persist();renderBadge();},
  charRandom:()=>{save.char.skin=Math.floor(Math.random()*SKINS.length);save.char.hair=pick(Object.keys(HAIRS));save.char.hairColor=pick(Object.keys(HAIR_COLORS));save.char.face=pick(Object.keys(FACES));persist();renderBadge();},
  preview:a=>{const g=GUNS[a];if(!g)return;const m=$('#pvm');m.classList.remove('hidden');$('#pvname').textContent=g.name;$('#pvfeel').textContent=(g.feel||'')+'　'+gunStats(g);$('#pvcanvas').dataset.gun=a;drawPreviews();},
  closePreview:()=>{$('#pvm').classList.add('hidden');},
  lbRename:()=>renderBadge(false),
  board:()=>renderBoard(),lbTab:a=>renderBoard(a),
  lbYes:()=>{save.lbConsent=true;persist();if(LB.pending){const r=LB.pending;LB.pending=null;lbAfterRun(r);}},
  lbNo:()=>{save.lbConsent=false;persist();LB.pending=null;const el=$('#lbstatus');if(el)el.textContent='好的，不會上傳。之後想上傳可以在設定裡打開。';},
  toggleLb:()=>{save.lbConsent=!save.lbConsent;persist();renderSettings();},
  toggleEasy:()=>{save.settings.easy=!save.settings.easy;persist();renderSettings();},
  toggleSound:()=>{save.settings.sound=!save.settings.sound;persist();renderSettings();},
  toggleMusic:()=>{save.settings.music=!save.settings.music;persist();musicGain();renderSettings();},
  musicVol:()=>{save.settings.musicVol=save.settings.musicVol%3+1;persist();musicGain();renderSettings();},
  toggleGunSfx:()=>{save.settings.gun=!save.settings.gun;persist();renderSettings();if(save.settings.gun)gunSfx('stapler');},
  gunVol:()=>{save.settings.gunVol=save.settings.gunVol%3+1;persist();renderSettings();gunSfxLast.stapler=0;gunSfx('stapler');},
  sfxVol:()=>{save.settings.sfxVol=save.settings.sfxVol%3+1;persist();renderSettings();sfxLast.power=0;sfx('power');},
  reset:()=>{if(!resetArm){resetArm=true;renderSettings();scr.querySelector('[data-act="reset"]').focus();return;}try{localStorage.removeItem(SAVE_KEY);}catch(e){}save=loadSave();resetArm=false;renderMenu();},
  resume:resumeGame,quit:()=>endRun(false,true),
  retry:()=>{const lv=G?G.lv:pendingLv;const lo=save.loadout.length===2?save.loadout.slice():pickSel.slice();G=null;if(lo.length<2){ACTIONS.pickLevel(lv);return;}elevatorTo(lv,()=>startRun(lv,lo));},
};
$('#pvm').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){ACTIONS[b.dataset.act](b.dataset.arg,b);return;}if(e.target.id==='pvm')ACTIONS.closePreview();});
scr.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;sfx('ui');ACTIONS[b.dataset.act]&&ACTIONS[b.dataset.act](b.dataset.arg,b);});
setInterval(()=>{if($('#pv')){previewT+=.12;drawPreview();}},120);
function elevatorTo(lv,cb){const d=$('#doors');if(matchMedia('(prefers-reduced-motion: reduce)').matches){cb();return;}$('#doornum').textContent=LEVELS[lv].floor;d.classList.remove('open');d.classList.add('on');hideScreen();sfx('ui');setTimeout(()=>{cb();requestAnimationFrame(()=>d.classList.add('open'));setTimeout(()=>{d.classList.remove('on');d.classList.remove('open');},650);},450);}
const bootEl=$('#boot');let booted=false;
function boot(){if(booted)return;booted=true;ensureAC();musicGain();const go=()=>{bootEl.classList.add('out');setTimeout(()=>bootEl.classList.add('hidden'),420);if(!save.seenBadge)renderBadge(true);else renderMenu();};
  if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(go);else go();}
bootEl.addEventListener('pointerdown',boot);window.addEventListener('keydown',e=>{if(!booted&&!bootEl.classList.contains('hidden'))boot();},{once:false});
requestAnimationFrame(loop);
</script>
