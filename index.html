const spriteCache=new Map();

function finishSprite(key,a,rim){
  const w=a.width,h=a.height,x=a.getContext('2d');
  if(rim){const src=x.getImageData(0,0,w,h).data;const o=document.createElement('canvas');o.width=w;o.height=h;const ox=o.getContext('2d');ox.fillStyle=rim;
    for(let r=0;r<h;r++)for(let c=0;c<w;c++){if(src[(r*w+c)*4+3])continue;const n=[[1,0],[-1,0],[0,1],[0,-1]].some(([dc,dr])=>{const cc=c+dc,rr=r+dr;return cc>=0&&rr>=0&&cc<w&&rr<h&&src[(rr*w+cc)*4+3];});if(n)ox.fillRect(c,r,1,1);}
    ox.drawImage(a,0,0);a=o;}
  const b=document.createElement('canvas');b.width=w;b.height=h;const y=b.getContext('2d');y.drawImage(a,0,0);y.globalCompositeOperation='source-in';y.fillStyle='#fff';y.fillRect(0,0,w,h);

function inDesk(x,y,m,desks){for(const d of desks)if(x>d.x-m&&x<d.x+d.w+m&&y>d.y-m&&y<d.y+d.h+m)return true;return false;}
function pushOut(o,rad,desks){
  for(const d of desks){const cx=clamp(o.x,d.x,d.x+d.w),cy=clamp(o.y,d.y,d.y+d.h);let dx=o.x-cx,dy=o.y-cy;const d2=dx*dx+dy*dy;if(d2>=rad*rad)continue;
    if(d2===0){const l=o.x-d.x,rr=d.x+d.w-o.x,t=o.y-d.y,b=d.y+d.h-o.y,m=Math.min(l,rr,t,b);if(m===l)o.x=d.x-rad;else if(m===rr)o.x=d.x+d.w+rad;else if(m===t)o.y=d.y-rad;else o.y=d.y+d.h+rad;}
    else{const dist=Math.sqrt(d2),push=rad-dist;o.x+=dx/dist*push;o.y+=dy/dist*push;}}
}

  const e={type,x:pos.x,y:pos.y,r:T.r,hp:T.hp*(1+lv*.32),speed:T.speed*(1+lv*.04)*rand(.9,1.1),dmg:T.dmg*(1+lv*.1),coin:T.coin,scale:T.scale,pal:type,flash:0,atk:rand(1,2.5),seed:Math.random()*10,anim:Math.random()*4,face:1,minion:!!minion,stun:0,slow:0,touchCd:0,healCd:rand(1,2)};
  e.maxHp=e.hp;G.enemies.push(e);return e;
}
function makeBoss(key,a,hpMul=1){
  const B=BOSSES[key],p=G.player;
  const b={type:'boss',boss:true,bkey:key,name:B.name,x:clamp(p.x+Math.cos(a)*430,90,WORLD.w-90),y:clamp(p.y+Math.sin(a)*430,90,WORLD.h-90),r:B.scale*12*.42,hp:B.hp*hpMul,maxHp:B.hp*hpMul,speed:B.speed,dmg:25,coin:0,scale:B.scale,pal:'boss_'+key,flash:0,
    patterns:B.patterns,pi:0,pcd:2.2,words:B.words,spiral:0,spAcc:0,spAng:0,dash:null,boost:0,anim:0,face:1,seed:0,stun:0,slow:0,salary:!!B.salary,front:!!B.front,touchCd:0,rage:0};
  G.enemies.push(b);G.bosses.push(b);if(!G.boss)G.boss=b;burst(b.x,b.y,'#e2443b',40,300,4);return b;
}
const ENDLESS_BOSSES=['leader','kpi','accountant','blame','hr','boss','legal','cio','chairman'];
function startBoss(){
  const g=G;g.phase='boss';const a=Math.random()*TAU;
  if(g.def.boss==='board'){for(const [i,k] of ['dir_fin','dir_ops','dir_hr'].entries())makeBoss(k,a+i*TAU/3);g.banner={text:'⚠ 董事會開始了',sub:'「三位董事一致決議：你今天不能下班。」',t:3};}
  else{const b=makeBoss(g.def.boss,a);g.banner={text:'⚠ '+b.name+' 出現了',sub:BOSSES[g.def.boss].line,t:2.8};}
  g.shake=12;sfx('alarm');
}
function endlessBoss(){
  const g=G,key=pick(ENDLESS_BOSSES),mul=1+g.time/150;const b=makeBoss(key,Math.random()*TAU,mul);b.maxHp=b.hp=Math.round(BOSSES[key].hp*mul);
  g.banner={text:'⚠ '+b.name+' 來巡視了',sub:BOSSES[key].line,t:2.4};g.shake=10;sfx('alarm');
}

/* ---------- 射擊 ---------- */
function fire(){
  const p=G.player,s=p.slots[p.active],g=GUNS[s.id],st=p.st,lvMul=1+.25*(s.lv-1);
  p.flashT=.05;p.recoil=g.recoil||3;
  const dmg=g.dmg*lvMul*st.dmg;
  if(g.melee){const m=g.melee,cx=p.x+Math.cos(p.aim)*m.reach,cy=p.y+Math.sin(p.aim)*m.reach;
    for(const e of G.enemies){if(e.dead)continue;const d=Math.hypot(e.x-cx,e.y-cy);if(d<m.radius+e.r){hurt(e,dmg);knock(e,cx,cy,m.kb);}}
    G.decals.push({x:cx,y:cy,life:1.5,text:'核准'});burst(cx,cy,'#c1121f',14,220,4);G.shake=Math.max(G.shake,6);sfx('boom');p.cd=g.rate/st.rate;return;}
  if(g.beam){p.charge=g.beam.charge;p.chargeDmg=dmg;p.cd=g.rate/st.rate;sfx('charge');return;}
  const n=g.pellets+st.multi,fan=g.fan||.12,reach=gunSprite(s.id).img.width*2.2-(g.grip||3)*2.2+6;
  const ox=p.x+Math.cos(p.aim)*reach,oy=p.y-2+Math.sin(p.aim)*reach;
  for(let i=0;i<n;i++){const a=p.aim+(n>1?(i-(n-1)/2)*fan:0)+rand(-g.spread,g.spread);
    G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*g.speed,vy:Math.sin(a)*g.speed,dmg,pierce:g.pierce+st.pierce,life:g.life,size:g.size,color:g.color,explode:g.explode||0,kind:g.kind||'',glow:g.glow||null,confetti:!!g.confetti,
      slow:g.slow||0,stun:g.stun||0,kb:g.kb||0,chain:g.chain||0,homing:g.homing||0,boom:g.boomerang||0,t:0,hit:new Set(),spin:0});}
  p.cd=g.rate/st.rate;sfx('shoot');
}
function fireBeam(){
  const p=G.player,g=GUNS[p.slots[p.active].id].beam,dmg=p.chargeDmg,cx=Math.cos(p.aim),cy=Math.sin(p.aim);
  for(const e of G.enemies){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,t=dx*cx+dy*cy;if(t<0||t>g.len)continue;const off=Math.abs(dx*cy-dy*cx);if(off<g.width/2+e.r)hurt(e,dmg,true);}
  G.zaps.push({x1:p.x,y1:p.y-2,x2:p.x+cx*g.len,y2:p.y-2+cy*g.len,life:.35,w:g.width,color:'#c77dff'});
  G.banner={text:'我不幹了！',sub:'',t:.9};G.shake=14;p.recoil=14;sfx('beam');burst(p.x+cx*30,p.y+cy*30,'#c77dff',30,300,4);
}
function knock(e,fx,fy,k){if(e.boss)k*=.15;const dx=e.x-fx,dy=e.y-fy,d=Math.hypot(dx,dy)||1;e.x+=dx/d*k;e.y+=dy/d*k;}
function hurt(e,dmg,ignoreFront){
  if(e.dead)return;e.hp-=dmg;e.flash=.07;
  if(dmg>=12||Math.random()<.3)floatText(e.x+rand(-8,8),e.y-e.r-8,Math.round(dmg),e.boss?'#ffd23f':'#ffffff',e.boss?15:12);
  if(e.hp<=0){e.dead=true;onKill(e);}else sfx('hit');
}
function blockedByFront(e,b){
  if(!(e.shield||e.front))return false;if(b.explode||b.pierce>=3)return false;
  const dot=(-b.vx)*e.face;return dot>Math.hypot(b.vx,b.vy)*.35;
}
function explode(x,y,rad,dmg){for(const e of G.enemies){const d=Math.hypot(e.x-x,e.y-y);if(d<rad+e.r)hurt(e,dmg*(1-.4*Math.min(1,d/rad)),true);}burst(x,y,'#ffffff',18,260,4);burst(x,y,'#ffb703',16,220,4);G.shake=Math.max(G.shake,7);sfx('boom');}
function enemyExplode(e,rad,dmg){const p=G.player;if(Math.hypot(p.x-e.x,p.y-e.y)<rad+p.r)damagePlayer(dmg);burst(e.x,e.y,'#e2443b',22,260,4);burst(e.x,e.y,'#ffffff',10,200,3);G.shake=Math.max(G.shake,5);sfx('boom');
  for(let i=0;i<4;i++)eshoot(e,i/4*TAU+.4,200,{label:'離職信',dmg:8});}
function dropCoins(x,y,count,value){for(let i=0;i<count;i++)G.pickups.push({type:'coin',x:x+rand(-10,10),y:y+rand(-10,10),vx:rand(-90,90),vy:rand(-90,90),value,life:25});}
function onKill(e){
  const g=G,p=g.player;sfx('kill');
  if(e.boss){burst(e.x,e.y,'#8fd14f',70,380,5);burst(e.x,e.y,'#ffd23f',50,320,4);g.shake=16;dropCoins(e.x,e.y,36,3+Math.min(g.lv,9));g.bossKills++;
    g.bosses=g.bosses.filter(b=>b!==e);if(g.boss===e)g.boss=g.bosses[0]||null;
    if(g.def.endless){g.banner={text:e.name+' 被打下班了',sub:'加班繼續',t:2};g.vacuum=Math.max(g.vacuum,1.2);sfx('power');return;}
    if(g.bosses.length){for(const b of g.bosses){b.rage++;b.speed*=1.2;}g.banner={text:e.name+' 被打下班了',sub:'其他董事火大了，變得更快',t:2.2};sfx('power');return;}
    g.phase='done';g.winT=2.6;g.vacuum=99;
    for(const o of g.enemies)if(!o.dead&&!o.boss){o.dead=true;burst(o.x,o.y,'#8fd14f',8);}g.ebullets.length=0;g.walls.length=0;g.zones.length=0;g.banner={text:g.def.rooftop?'董事會散會了':e.name+' 被打下班了',sub:'撿金幣中…',t:2.4};sfx('power');return;}
  burst(e.x,e.y,'#8fd14f',10,170,3);
  const cmul=g.def.survival?2:1;dropCoins(e.x,e.y,Math.round(e.coin*(1+g.lv*.12))*cmul,1);
  if(e.type==='bomber'&&!e.exploded){e.exploded=true;enemyExplode(e,60,12);}
  if(e.type==='splitter'){for(const o of[-1,1])spawnEnemy('mini',{x:e.x+o*14,y:e.y},true);}
  if(OUTFITS[save.outfit].bonus.envelope&&Math.random()<.1){dropCoins(e.x,e.y,5,1);floatText(e.x,e.y-20,'紅包！','#ff6b6b',14);burst(e.x,e.y,'#e2443b',10,200,3);}
  if(!e.minion){const r=Math.random(),sk=.035*p.st.skill,hl=g.def.survival?.06:.03;
    if(r<sk)g.pickups.push({type:'skill',x:e.x,y:e.y,id:pick(Object.keys(SKILLS)),life:20});
    else if(r<sk+.015)g.pickups.push({type:'gun',x:e.x,y:e.y,id:pick(save.guns),lv:1,life:25});
    else if(r<sk+.015+hl)g.pickups.push({type:'heal',x:e.x,y:e.y,life:20});}
  if(g.phase==='wave')g.kills++;p.kills++;
  if(OUTFITS[save.outfit].bonus.meow){p.meowKills++;if(p.meowKills>=30){p.meowKills=0;g.vacuum=Math.max(g.vacuum,1.5);floatText(p.x,p.y-40,'喵～','#f4a261',22);sfx('meow');}}
}
function eshoot(src,a,speed,opt={}){if(G.ebullets.length>260)return;G.ebullets.push({x:src.x+Math.cos(a)*src.r*.6,y:src.y+Math.sin(a)*src.r*.6,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,dmg:opt.dmg||12,life:opt.life||4,r:opt.r||7,homing:!!opt.homing,label:opt.label||null,salary:!!opt.salary,jam:!!opt.jam});}
function damagePlayer(d,src){
  const p=G.player,g=G,ob=OUTFITS[save.outfit].bonus;if(p.invuln>0||g.dead||g.phase==='done'||p.dashT>0)return;
  if(ob.dodge&&Math.random()<ob.dodge){p.invuln=.4;p.ghosts.push({x:p.x,y:p.y,life:.4,face:p.face,frame:p.frame||1});floatText(p.x,p.y-30,'閃避！','#e63946',14);return;}
  if(p.shield>0){p.shield--;p.invuln=.8;floatText(p.x,p.y-30,'特休擋下！','#7bdff2',14);sfx('power');return;}
  d*=1-p.st.armor;p.hp-=d;p.invuln=.55*p.st.invuln;p.stealthT=0;p.stealth=false;g.shake=Math.max(g.shake,6);sfx('hurt');burst(p.x,p.y,'#e2443b',8,150,3);
  if(ob.shock){for(const e of g.enemies){if(e.dead)continue;if(Math.hypot(e.x-p.x,e.y-p.y)<130){knock(e,p.x,p.y,70);hurt(e,10,true);}}burst(p.x,p.y,'#ffd23f',16,260,3);}
  if(p.hp<=0){
    if(ob.revive&&!p.revived){p.revived=true;p.hp=p.maxHp*.5;p.invuln=2;g.banner={text:'死線延後了',sub:'再撐一下',t:1.8};for(const e of g.enemies){if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<200)knock(e,p.x,p.y,140);}burst(p.x,p.y,'#ff2e2e',40,320,4);sfx('power');return;}
    p.hp=0;g.dead=true;g.deadT=1.4;burst(p.x,p.y,'#e2443b',40,260,4);g.banner={text:'你被加班吞噬了',sub:'',t:1.6};}
}
function doSwap(c){
  const p=G.player,old=p.slots[p.active];
  p.slots[p.active]={id:c.id,lv:c.lv||1};c.life=0;
  G.pickups.push({type:'gun',x:p.x+rand(-14,14),y:p.y+24,id:old.id,lv:old.lv,life:40,dropped:true});
  toast('換成 '+GUNS[c.id].name+' Lv'+(c.lv||1)+'，'+GUNS[old.id].name+' 掉在地上');sfx('power');G.nearCrate=null;updateActBtn();
}
function crateStatus(c){const p=G.player,i=p.slots.findIndex(s=>s.id===c.id);if(i<0)return'swap';return p.slots[i].lv>=5?'max':'up';}

/* ---------- 魔王 ---------- */
function bossAI(b,dt){
  const p=G.player,dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1,angry=b.hp<b.maxHp*.5,slowM=b.slow>0?.5:1;
  if(b.dash){if(b.dash.wind>0)b.dash.wind-=dt;else{b.x+=b.dash.vx*dt;b.y+=b.dash.vy*dt;b.dash.t-=dt;if(b.dash.t<=0)b.dash=null;}}
  else{const sp=b.speed*(angry?1.25:1)*(b.boost>0?1.9:1)*slowM;b.boost-=dt;if(d>b.r+p.r){b.x+=dx/d*sp*dt;b.y+=dy/d*sp*dt;}}
  b.x=clamp(b.x,b.r,WORLD.w-b.r);b.y=clamp(b.y,b.r,WORLD.h-b.r);
  if(b.spiral>0){b.spiral-=dt;b.spAcc+=dt;while(b.spAcc>.075){b.spAcc-=.075;b.spAng+=.38;eshoot(b,b.spAng,190,{label:Math.random()<.15?pick(b.words):null,salary:b.salary});eshoot(b,b.spAng+Math.PI,190,{salary:b.salary});}}
  b.pcd-=dt*slowM;
  if(b.pcd<=0&&!b.dash){
    const pat=b.patterns[b.pi++%b.patterns.length],base=Math.atan2(dy,dx),S=b.salary;
    if(pat==='burst'){const n=angry?20:14;for(let i=0;i<n;i++)eshoot(b,i/n*TAU+b.pi*.2,210,{label:i%4===0?pick(b.words):null,salary:S});}
    else if(pat==='spread'){const n=angry?9:7;for(let i=0;i<n;i++)eshoot(b,base+(i-(n-1)/2)*.15,290,{label:i===(n-1)/2?pick(b.words):null,salary:S});}
    else if(pat==='dash'){b.dash={wind:.65,t:.55,vx:dx/d*580,vy:dy/d*580};}
    else if(pat==='homing'){for(const o of[-.7,0,.7])eshoot(b,base+o,175,{homing:true,life:4.5,r:9,dmg:14,label:pick(b.words),salary:S});}
    else if(pat==='spiral'){b.spiral=1.7;}
    else if(pat==='summon'){const n=angry?6:4;for(let i=0;i<n;i++){const a=i/n*TAU;spawnEnemy(Math.random()<.5?'runner':'walker',{x:clamp(b.x+Math.cos(a)*80,40,WORLD.w-40),y:clamp(b.y+Math.sin(a)*80,40,WORLD.h-40)},true);}burst(b.x,b.y,'#8fd14f',24,260,4);}
    else if(pat==='chase'){b.boost=1.4;}
    else if(pat==='update'){const n=angry?4:3;for(let i=0;i<n;i++){const a2=Math.random()*TAU,rr=i===0?0:rand(80,170);G.zones.push({x:clamp(p.x+Math.cos(a2)*rr,60,WORLD.w-60),y:clamp(p.y+Math.sin(a2)*rr,60,WORLD.h-60),r:72,t:0,dur:angry?2:2.6});}}
    else if(pat==='bsod'){const n=angry?7:5;for(let i=0;i<n;i++)eshoot(b,base+(i-(n-1)/2)*.12,330,{label:i%2===0?'藍屏':null,jam:true,dmg:10,r:8});}
    else if(pat==='stamp'){const n=angry?3:2;for(let i=0;i<n;i++){const a=Math.random()*TAU,rr=i===0?0:rand(60,140);G.decals.push({x:p.x+Math.cos(a)*rr,y:p.y+Math.sin(a)*rr,life:.8,warn:true,r:70});}}
    else if(pat==='wall'){for(let i=0;i<3;i++){const a=base+(i-1)*.5,wx=p.x+Math.cos(a)*(-90)+rand(-30,30),wy=p.y+Math.sin(a)*(-90)+rand(-30,30);G.walls.push({x:clamp(wx-45,30,WORLD.w-120),y:clamp(wy-14,30,WORLD.h-60),w:90,h:28,life:5});}burst(b.x,b.y,'#ffffff',16,200,3);}
    b.pcd=(angry?1.5:2.3)*Math.pow(.8,b.rage||0);
  }
}

/* ---------- 主更新 ---------- */
function nearestEnemy(x,y,maxD){let best=null,bd=maxD*maxD;for(const e of G.enemies){if(e.dead)continue;const d2=(e.x-x)**2+(e.y-y)**2;if(d2<bd){bd=d2;best=e;}}return best;}
function update(dt){
  const g=G,p=g.player,ob=OUTFITS[save.outfit].bonus;g.time+=dt;
  // 玩家移動
  let mx=0,my=0;
  if(!g.dead){
    if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
    if(joy.active){const jx=(joy.x-joy.ox)/55,jy=(joy.y-joy.oy)/55;if(Math.hypot(jx,jy)>.15){mx=jx;my=jy;}}
    const len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len;}p.mx=mx;p.my=my;
    const sp=210*p.st.spd*(p.charge>0?.5:1);
    if(p.dashT>0){p.dashT-=dt;p.x+=p.dashVx*dt;p.y+=p.dashVy*dt;if(Math.random()<.6)g.parts.push({x:p.x,y:p.y+10,vx:0,vy:0,life:.3,max:.3,color:'#7bdff2',size:4});}
    else{p.x+=mx*sp*dt;p.y+=my*sp*dt;}
    p.x=clamp(p.x,p.r+24,WORLD.w-p.r-24);p.y=clamp(p.y,p.r+24,WORLD.h-p.r-24);pushOut(p,p.r,g.desks);pushOut(p,p.r,g.walls);
    p.moving=len>.1;
    if(p.moving){const back=(mx*Math.cos(p.aim)+my*Math.sin(p.aim))<-.3;p.anim+=dt*(back?-1:1)*9;if(Math.random()<dt*6)g.parts.push({x:p.x+rand(-6,6),y:p.y+15,vx:rand(-15,15),vy:-10,life:.35,max:.35,color:'rgba(200,200,190,.5)',size:3});}
    else p.idle+=dt;
    if(ob.wet&&p.moving){p.wetT-=dt;if(p.wetT<=0){p.wetT=.22;g.puddles.push({x:p.x,y:p.y+12,life:4,r:22});if(g.puddles.length>60)g.puddles.shift();}}
    if(p.st.regen>0&&p.hp<p.maxHp)p.hp=Math.min(p.maxHp,p.hp+p.st.regen*dt);
  }
  p.invuln-=dt;p.swapCd-=dt;p.cd-=dt;p.flashT-=dt;p.dashCd-=dt;p.jam-=dt;p.recoil=Math.max(0,p.recoil-dt*40);
  for(const gh of p.ghosts)gh.life-=dt;p.ghosts=p.ghosts.filter(x=>x.life>0);
  if(ob.stealth&&!g.dead){p.stealthT+=dt;p.stealth=p.stealthT>=5;}
  if(ob.flash&&!g.dead){p.flashCd-=dt;if(p.flashCd<=0){p.flashCd=15;g.flashFx=.35;for(const e of g.enemies){if(e.dead)continue;if(e.boss)e.slow=Math.max(e.slow,2);else e.stun=Math.max(e.stun,2);}toast('閃光：你們什麼都沒看到',1.5);sfx('power');}}
  const oaT=OUTFITS[save.outfit].tier;
  if(oaT==='legend'&&!g.dead&&Math.random()<dt*10&&g.parts.length<440)g.parts.push({x:p.x+rand(-18,18),y:p.y+rand(-30,14),vx:rand(-10,10),vy:rand(-50,-20),life:.6,max:.6,color:OUTFITS[save.outfit].aura||'#ffd23f',size:3});
  if(GUNS[p.slots[p.active].id].tier==='legend'&&!g.dead&&Math.random()<dt*8&&g.parts.length<440){const r=gunSprite(p.slots[p.active].id).img.width*2.2*Math.random();g.parts.push({x:p.x+Math.cos(p.aim)*r,y:p.y+2+Math.sin(p.aim)*r,vx:rand(-20,20),vy:rand(-20,20),life:.4,max:.4,color:GUNS[p.slots[p.active].id].glow,size:2});}
  // 瞄準與射擊（全自動）
  if(!g.dead&&g.phase!=='done'){
    let firing=false,best=nearestEnemy(p.x,p.y,640);
    if(g.boss&&!g.boss.dead&&(g.boss.x-p.x)**2+(g.boss.y-p.y)**2<360*360&&(!best||(best.x-p.x)**2+(best.y-p.y)**2>90*90))best=g.boss;
    if(best){p.aim=Math.atan2(best.y-p.y,best.x-p.x);firing=true;}else if(p.moving)p.aim=Math.atan2(my,mx);
    p.face=Math.cos(p.aim)>=0?1:-1;
    if(p.charge>0){p.charge-=dt;if(Math.random()<dt*30)g.parts.push({x:p.x+rand(-40,40),y:p.y+rand(-40,40),vx:0,vy:0,life:.3,max:.3,color:'#c77dff',size:3,to:true});if(p.charge<=0)fireBeam();}
    else if(firing&&p.cd<=0&&p.jam<=0)fire();
  }
  // 生怪
  const alive=g.enemies.filter(e=>!e.boss&&!e.dead).length,def=g.def;
  if(g.phase==='wave'){

  p.slots.forEach((s,i)=>{const x=bx0+i*(bw+gap),on=i===p.active;ctx.fillStyle=on?'#ffd23f':'rgba(13,15,20,.75)';ctx.fillRect(x,by,bw,bh);if(!on){ctx.strokeStyle='#4b5366';ctx.lineWidth=2;ctx.strokeRect(x+1,by+1,bw-2,bh-2);}
    ctx.imageSmoothingEnabled=false;const im=gunSprite(s.id).img,k=Math.min(36/im.width,24/im.height);ctx.drawImage(im,x+6+(36-im.width*k)/2,by+bh/2-im.height*k/2,im.width*k,im.height*k);
    ctx.textAlign='left';ctx.fillStyle=on?'#1a1d27':'#eef0e8';ctx.font='900 '+(small?11:13)+'px "Noto Sans TC",sans-serif';ctx.fillText(GUNS[s.id].name,x+46,by+19);ctx.font='12px "DotGothic16",monospace';ctx.fillText((i+1)+'號　Lv'+s.lv,x+46,by+36);
    if(on&&p.cd>0&&GUNS[s.id].rate>=1){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x,by,bw*Math.min(1,p.cd/(GUNS[s.id].rate/p.st.rate)),bh);}});
  if(!isTouch){ctx.textAlign='center';ctx.font='12px "Noto Sans TC",sans-serif';ctx.fillStyle='rgba(238,240,232,.6)';ctx.fillText('Q／滾輪／右鍵 換槍'+(ob.dash?'　空白鍵 衝刺':''),W/2,by-8);}
  if(joy.active){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,55,0,TAU);ctx.stroke();const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),k=d>55?55/d:1;ctx.fillStyle='rgba(255,210,63,.7)';ctx.beginPath();ctx.arc(joy.ox+dx*k,joy.oy+dy*k,24,0,TAU);ctx.fill();}
  if(g.banner&&g.banner.t>0){const a=Math.min(1,g.banner.t*1.5);ctx.globalAlpha=a;ctx.fillStyle='rgba(13,15,20,.8)';ctx.fillRect(0,H/2-54,W,g.banner.sub?100:74);ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.font='900 '+(small?26:36)+'px "Noto Sans TC",sans-serif';ctx.fillText(g.banner.text,W/2,H/2-6);
    if(g.banner.sub){ctx.fillStyle='#eef0e8';ctx.font='500 '+(small?13:16)+'px "Noto Sans TC",sans-serif';ctx.fillText(g.banner.sub,W/2,H/2+28);}ctx.globalAlpha=1;}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#12151d';ctx.fillRect(0,0,W,H);
  const vw=W/ZOOM,vh=H/ZOOM;let cam,desks,fa,fb;
  if(G){const p=G.player;cam={x:camFit(p.x-vw/2,WORLD.w,vw),y:camFit(p.y-vh/2,WORLD.h,vh)};G.cam=cam;desks=G.desks;fa=G.def.fa;fb=G.def.fb;}
  else{cam={x:camFit(WORLD.w/2-vw/2+Math.sin(demo.t*.12)*260,WORLD.w,vw),y:camFit(WORLD.h/2-vh/2+Math.cos(demo.t*.09)*180,WORLD.h,vh)};desks=demo.desks;fa='#2c3a55';fb='#283450';}
  const sh=G?G.shake:0,sx=rand(-sh,sh),sy=rand(-sh,sh);
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,(-cam.x+sx)*DPR*ZOOM,(-cam.y+sy)*DPR*ZOOM);ctx.imageSmoothingEnabled=false;
  drawFloor(cam,vw,vh,fa,fb);drawDesks(desks);
  if(G){drawGame();if(G.def.dark)drawDark(cam,vw,vh);}else{const zs=demo.zs.slice().sort((a,b)=>a.y-b.y);for(const z of zs){const fr=Math.floor(z.anim*6)%4;drawSpriteAt(zombieSprite(z.type,fr),z.x,z.y+ZLURCH[fr]*.8,ETYPES[z.type].scale,z.face,false,1);}}
  if(G)drawHUD();ctx.setTransform(DPR,0,0,DPR,0,0);
  if(mode!=='play'){ctx.fillStyle='rgba(10,12,18,.55)';ctx.fillRect(0,0,W,H);}
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(mode==='play'&&G)update(dt);else if(!G)updateDemo(dt);render();requestAnimationFrame(loop);}

/* ================= 選單 ================= */
const scr=$('#screen');let pendingLv=0,pickSel=[],resetArm=false,previewT=0;
function show(html,focusSel){scr.innerHTML=html;scr.classList.remove('hidden');scr.scrollTop=0;if(isTouch)return;const f=(focusSel&&scr.querySelector(focusSel))||scr.querySelector('button:not([disabled])');if(f)f.focus({preventScroll:true});}
function hideScreen(){scr.classList.add('hidden');scr.innerHTML='';}
const tierTag=t=>'<span class="tier" style="--tc:'+TIERS[t].color+'">'+TIERS[t].name+'</span>';
const coinTag=n=>'<span class="wallet"><i class="coin"></i>'+n+'</span>';
function gunStats(g){if(g.melee)return'傷害 '+g.dmg+'　範圍攻擊　每 '+g.rate+' 秒';if(g.beam)return'傷害 '+g.dmg+'　貫穿全場　每 '+g.rate+' 秒';return'傷害 '+g.dmg+(g.pellets>1?'×'+g.pellets:'')+'　射速 '+(1/g.rate).toFixed(1)+'/秒'+(g.pierce?'　穿透 '+(g.pierce>50?'無限':g.pierce):'')+(g.explode?'　爆炸':'');}
function outfitIcon(id,ch){const spr=charSprite(ch||save.char,id,1,true);return toIcon('o'+id+charKey(ch||save.char,id,1,true),spr.img,5);}
function playerName(){return save.char.name||'社畜';}

function renderMenu(){
  mode='menu';G=null;controlsUI(false);resetArm=false;const o=OUTFITS[save.outfit];
  show('<div class="memo" role="dialog" aria-label="主選單"><h1>殭屍辦公室</h1><p>整棟公司的人都變成殭屍了。帶著文具槍一路殺上頂樓，把主管和老闆都打下班。</p>'+coinTag(save.coins)+
    '<button class="btn" data-act="levels">開始上班</button>'+
    '<button class="btn" data-act="shop">武器庫（'+save.guns.length+'/'+Object.keys(GUNS).length+'）</button>'+
    '<button class="btn" data-act="wardrobe">更衣室：'+esc(o.name)+'</button>'+
    '<button class="btn" data-act="badge">員工證：'+esc(playerName())+'</button>'+
    '<button class="btn ghost" data-act="settings">設定</button>'+
    '<p class="hint">'+(isTouch?'左手拖曳移動，自動瞄準射擊。黃色按鈕切換手上的槍，藍色按鈕撿槍箱或衝刺。':'WASD 移動，自動瞄準射擊。Q／滾輪／右鍵換槍，F 換槍箱，空白鍵衝刺，Esc 暫停。')+'</p></div>');
}
function renderLevels(){
  const cur=save.unlocked;
  const btns=LEVELS.map((L,i)=>({L,i})).reverse().map(({L,i})=>{const locked=i>save.unlocked,done=save.cleared.includes(i);
    return'<button class="floor'+(i===cur?' cur':'')+(done?' done':'')+'" data-act="pickLevel" data-arg="'+i+'"'+(locked?' disabled':'')+' aria-label="'+L.floor+' '+L.name+(locked?'，尚未解鎖':'')+'"><span class="dot">'+L.floor+'</span><small>'+(locked?'🔒 未解鎖':esc(L.name)+(done?' ✓':''))+'</small></button>';}).join('');
  const bossLine=L=>L.survival?'午休保衛戰：撐過 '+L.survival+' 秒':L.endless?'撐越久分數越高　最佳 '+save.bestEndless:L.boss==='board'?'魔王：董事會（三位董事）':'魔王：'+BOSSES[L.boss].name+(L.dark?'　停電樓層':'');
  show('<div class="elevator" role="dialog" aria-label="選擇樓層"><div class="display" id="edisp">'+LEVELS[cur].floor+' '+esc(LEVELS[cur].name)+'</div><p class="boss" id="eboss">'+esc(bossLine(LEVELS[cur]))+'</p><div class="floors">'+btns+'</div><button class="btn ghost" data-act="menu">返回</button></div>','.floor.cur');
  scr.querySelectorAll('.floor:not([disabled])').forEach(b=>{const upd=()=>{const L=LEVELS[+b.dataset.arg];$('#edisp').textContent=L.floor+' '+L.name;$('#eboss').textContent=bossLine(L);};b.addEventListener('pointerenter',upd);b.addEventListener('focus',upd);});
}
function renderLoadout(focusId){
  const L=LEVELS[pendingLv];
  const items=save.guns.map(id=>{const g=GUNS[id],k=pickSel.indexOf(id);return'<button class="item t-'+g.tier+(k>=0?' sel':'')+'" data-act="toggleGun" data-arg="'+id+'" aria-pressed="'+(k>=0)+'"><img src="'+gunIcon(id)+'" alt="" style="width:'+Math.min(76,g.rows[0].length*4)+'px"><div><h3>'+esc(g.name)+tierTag(g.tier)+'</h3><p class="stats">'+gunStats(g)+'</p></div><span class="slotno">'+(k>=0?k+1:'')+'</span></button>';}).join('');
  show('<div class="sheet" role="dialog" aria-label="選擇槍枝"><header><h2>'+L.floor+' '+esc(L.name)+'</h2><span>'+(L.survival?'撐過 '+L.survival+' 秒':L.endless?'無限模式':L.boss==='board'?'魔王：董事會':'魔王：'+esc(BOSSES[L.boss].name))+'</span></header><p class="lead">挑兩把槍帶去上班，先選的是 1 號槍。關卡裡的槍箱：綠色會升級手上的槍，橘色可以換成另一把。</p><div class="list">'+items+'</div>'+
    '<div class="row"><button class="btn ghost" data-act="levels">返回</button><button class="btn" data-act="start"'+(pickSel.length<2?' disabled':'')+'>打卡上班（已選 '+pickSel.length+'/2）</button></div></div>',focusId?'[data-arg="'+focusId+'"]':null);
}
function renderShop(focusId){
  const items=Object.entries(GUNS).map(([id,g])=>{const own=save.guns.includes(id);return'<div class="item t-'+g.tier+'"><img src="'+gunIcon(id)+'" alt="" style="width:'+Math.min(76,g.rows[0].length*4)+'px"><div><h3>'+esc(g.name)+tierTag(g.tier)+'</h3><p>'+esc(g.desc)+'</p><p class="stats">'+gunStats(g)+'</p></div>'+(own?'<span class="tag">已擁有</span>':'<button class="btn" data-act="buyGun" data-arg="'+id+'"'+(save.coins<g.price?' disabled':'')+'><i class="coin"></i>'+g.price+'</button>')+'</div>';}).join('');
  show('<div class="sheet" role="dialog" aria-label="武器庫"><header><h2>武器庫</h2>'+coinTag(save.coins)+'</header><p class="lead">買下的槍會永久保存，出發前從這裡挑兩把。</p><div class="list">'+items+'</div><div class="row"><button class="btn ghost" data-act="menu">返回</button></div></div>',focusId?'[data-arg="'+focusId+'"]':null);
}
function renderWardrobe(focusId){
  const items=Object.entries(OUTFITS).map(([id,o])=>{const own=save.outfits.includes(id),on=save.outfit===id;return'<div class="item t-'+o.tier+(on?' sel':'')+'"><img src="'+outfitIcon(id)+'" alt="" style="width:60px"><div><h3>'+esc(o.name)+tierTag(o.tier)+'</h3><p>'+esc(o.desc)+'</p></div>'+
    (on?'<span class="tag">穿著中</span>':own?'<button class="btn" data-act="wear" data-arg="'+id+'">換上</button>':'<button class="btn" data-act="buyOutfit" data-arg="'+id+'"'+(save.coins<o.price?' disabled':'')+'><i class="coin"></i>'+o.price+'</button>')+'</div>';}).join('');
  show('<div class="sheet" role="dialog" aria-label="更衣室"><header><h2>更衣室</h2>'+coinTag(save.coins)+'</header><p class="lead">服裝會改變外觀，也帶有能力。一次只能穿一套。</p><div class="list">'+items+'</div><div class="row"><button class="btn ghost" data-act="menu">返回</button></div></div>',focusId?'[data-arg="'+focusId+'"]':null);
}
function renderBadge(){
  const c=save.char;
  const sw=(list,key,cur)=>list.map(([k,col])=>'<button class="sw'+(String(k)===String(cur)?' on':'')+'" style="--c:'+col+'" data-act="charSet" data-key="'+key+'" data-arg="'+k+'" aria-label="'+key+' '+k+'"></button>').join('');
  const opts=(obj,key,cur)=>Object.entries(obj).map(([k,v])=>'<button class="opt'+(k===cur?' on':'')+'" data-act="charSet" data-key="'+key+'" data-arg="'+k+'">'+esc(v.name)+'</button>').join('');
  show('<div class="badge" role="dialog" aria-label="員工證"><div class="strap">EMPLOYEE ID</div><div class="body"><div><div class="photo"><canvas id="pv" width="120" height="170"></canvas><div class="cap" id="pvcap">'+esc(playerName())+'　'+esc(OUTFITS[save.outfit].name)+'</div></div></div><div>'+
    '<label for="nm">姓名</label><input id="nm" maxlength="12" value="'+esc(c.name)+'" placeholder="社畜" autocomplete="off">'+
    '<label>膚色</label><div class="sws">'+sw(SKINS.map((s,i)=>[i,s]),'skin',c.skin)+'</div>'+
    '<label>髮型</label><div class="sws">'+opts(HAIRS,'hair',c.hair)+'</div>'+
    '<label>髮色</label><div class="sws">'+sw(Object.entries(HAIR_COLORS),'hairColor',c.hairColor)+'</div>'+
    '<label>臉部</label><div class="sws">'+opts(FACES,'face',c.face)+'</div>'+
    '<div class="row"><button class="btn small ghost" data-act="charRandom">隨機</button></div></div></div>'+
    '<div class="foot"><div class="row"><button class="btn ghost" data-act="menu">完成</button></div></div></div>','#nm');
  const inp=$('#nm');inp.addEventListener('input',()=>{c.name=inp.value.slice(0,12);$('#pvcap').textContent=playerName()+'　'+OUTFITS[save.outfit].name;persist();});
  drawPreview();
}
function drawPreview(){
  const cvs=$('#pv');if(!cvs)return;const x=cvs.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,cvs.width,cvs.height);
  const fr=Math.floor(previewT*6)%4,spr=charSprite(save.char,save.outfit,fr,true),s=8;x.drawImage(spr.img,(cvs.width-12*s)/2,cvs.height-17*s-10+SINK[fr]*s,12*s,17*s);
}
function renderSettings(){
  show('<div class="memo" role="dialog" aria-label="設定"><h2>設定</h2><button class="btn" data-act="toggleSound">音效：'+(save.settings.sound?'開':'關')+'</button>'+
    '<button class="btn ghost" data-act="reset">'+(resetArm?'再按一次，清除所有金幣與解鎖':'清除存檔')+'</button><button class="btn ghost" data-act="menu">返回</button></div>');
}
function pauseGame(){if(mode!=='play')return;mode='paused';controlsUI(false);$('#actBtn').classList.add('hidden');
  show('<div class="memo" role="dialog" aria-label="暫停"><h2>暫停</h2><p>這局已經賺到 '+Math.floor(G.coins)+' 金幣，現在離開也會帶走。</p><button class="btn" data-act="resume">繼續上班</button><button class="btn ghost" data-act="quit">早退，回主選單</button></div>');}
function resumeGame(){hideScreen();mode='play';controlsUI(true);updateActBtn();last=performance.now();}
function endRun(win,quit){
  if(!G||G.ended)return;G.ended=true;const lv=G.lv,L=LEVELS[lv];
  if(L.endless){const t=Math.floor(G.time),score=t*10+G.player.kills*5+G.bossKills*500,earned=Math.floor(G.coins)+G.bossKills*100;save.coins+=earned;const best=score>save.bestEndless;if(best)save.bestEndless=score;persist();mode='result';controlsUI(false);$('#actBtn').classList.add('hidden');
    show('<div class="memo" role="dialog" aria-label="結算"><h1>加班結束</h1><p>'+esc(playerName())+'　撐了 '+Math.floor(t/60)+' 分 '+(t%60)+' 秒　擊倒 '+G.player.kills+' 隻，主管 '+G.bossKills+' 位</p><p class="pix" style="font-size:22px;margin:0 0 4px">分數 '+score+(best?'　新紀錄！':'')+'</p><p>最佳 '+save.bestEndless+'　本局金幣 +'+earned+(G.bossKills?'（含主管獎金 '+G.bossKills*100+'）':'')+'</p>'+coinTag(save.coins)+
      '<button class="btn" data-act="retry">再加班一次</button><button class="btn ghost" data-act="shop">去武器庫</button><button class="btn ghost" data-act="menu">回主選單</button></div>');return;}
  const bonus=win?(L.survival?300:120*(lv+1)):0,earned=Math.floor(G.coins)+bonus;
  save.coins+=earned;if(win){if(!save.cleared.includes(lv))save.cleared.push(lv);save.unlocked=Math.max(save.unlocked,Math.min(lv+1,LEVELS.length-1));}
  persist();mode='result';controlsUI(false);$('#actBtn').classList.add('hidden');
  const hasNext=win&&lv+1<LEVELS.length,final=win&&L.rooftop;
  const title=quit?'提早下班':win?(final?'全公司都下班了':'成功下班！'):'被加班吞噬了';
  const msg=final?'董事會也被'+esc(playerName())+'打散了。整棟樓終於安靜下來，但加班永遠不會結束：無限加班模式已解鎖。':win?'這層清乾淨了，'+LEVELS[lv+1].floor+' 已經解鎖。':quit?'今天的進度重置，賺到的金幣已經收進口袋。':'關卡會重置，但買過的槍和衣服都還在。';
  show('<div class="memo" role="dialog" aria-label="結算"><h1>'+title+'</h1><p>'+esc(playerName())+'　'+L.floor+' '+esc(L.name)+'　擊倒 '+G.player.kills+' 隻</p><p>'+msg+'</p><p class="pix" style="font-size:18px;margin:0">本局金幣 +'+earned+(bonus?'（含通關獎金 '+bonus+'）':'')+'</p>'+coinTag(save.coins)+
    (hasNext?'<button class="btn" data-act="pickLevel" data-arg="'+(lv+1)+'">'+(LEVELS[lv+1].endless?'進入無限加班':'前往 '+LEVELS[lv+1].floor+' '+esc(LEVELS[lv+1].name))+'</button>':'')+
    '<button class="btn'+(hasNext?' ghost':'')+'" data-act="retry">再打一次 '+L.floor+'</button><button class="btn ghost" data-act="shop">去武器庫</button><button class="btn ghost" data-act="menu">回主選單</button></div>');
}
const ACTIONS={
  menu:renderMenu,levels:()=>{G=null;mode='menu';renderLevels();},shop:()=>{G=null;mode='menu';renderShop();},wardrobe:()=>{G=null;mode='menu';renderWardrobe();},badge:()=>{G=null;mode='menu';renderBadge();},settings:()=>{resetArm=false;renderSettings();},
  pickLevel:a=>{G=null;mode='menu';pendingLv=+a;pickSel=save.loadout.filter(id=>save.guns.includes(id)).slice(0,2);for(const id of save.guns){if(pickSel.length>=2)break;if(!pickSel.includes(id))pickSel.push(id);}renderLoadout();},
  toggleGun:a=>{const k=pickSel.indexOf(a);if(k>=0)pickSel.splice(k,1);else if(pickSel.length<2)pickSel.push(a);else pickSel[1]=a;renderLoadout(a);},
  start:()=>{if(pickSel.length<2)return;save.loadout=pickSel.slice();persist();startRun(pendingLv,pickSel.slice());},
  buyGun:a=>{const g=GUNS[a];if(!g||save.guns.includes(a)||save.coins<g.price)return;save.coins-=g.price;save.guns.push(a);persist();sfx('power');renderShop(a);},
  buyOutfit:a=>{const o=OUTFITS[a];if(!o||save.outfits.includes(a)||save.coins<o.price)return;save.coins-=o.price;save.outfits.push(a);save.outfit=a;persist();sfx('power');renderWardrobe(a);},
  wear:a=>{if(!save.outfits.includes(a))return;save.outfit=a;persist();renderWardrobe(a);},
  charSet:(a,b)=>{const k=b.dataset.key;if(k==='skin')save.char.skin=+a;else save.char[k]=a;persist();renderBadge();},
  charRandom:()=>{save.char.skin=Math.floor(Math.random()*SKINS.length);save.char.hair=pick(Object.keys(HAIRS));save.char.hairColor=pick(Object.keys(HAIR_COLORS));save.char.face=pick(Object.keys(FACES));persist();renderBadge();},
  toggleSound:()=>{save.settings.sound=!save.settings.sound;persist();renderSettings();},
  reset:()=>{if(!resetArm){resetArm=true;renderSettings();scr.querySelector('[data-act="reset"]').focus();return;}try{localStorage.removeItem(SAVE_KEY);}catch(e){}save=loadSave();resetArm=false;renderMenu();},
  resume:resumeGame,quit:()=>endRun(false,true),
  retry:()=>{const lv=G?G.lv:pendingLv;const lo=save.loadout.length===2?save.loadout.slice():pickSel.slice();G=null;if(lo.length<2){ACTIONS.pickLevel(lv);return;}startRun(lv,lo);},
};
scr.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;sfx('ui');ACTIONS[b.dataset.act]&&ACTIONS[b.dataset.act](b.dataset.arg,b);});
setInterval(()=>{if($('#pv')){previewT+=.12;drawPreview();}},120);
renderMenu();requestAnimationFrame(loop);
</script>
