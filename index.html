<style>
:root{--carpet:#1b1f2b;--ink:#1a1d27;--paper:#eef0e8;--postit:#ffd23f;--alarm:#e2443b;--muted:#4a5160;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--carpet:#1b1f2b}}
:root[data-theme="dark"]{--carpet:#1b1f2b}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--carpet);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--paper)}
.pix{font-family:"DotGothic16","Noto Sans TC",monospace}
#game{position:fixed;inset:0;display:block;image-rendering:pixelated;cursor:default}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
#screen.hidden{display:none}
.memo{background:var(--postit);color:var(--ink);width:min(420px,100%);padding:30px 26px 24px;position:relative;box-shadow:7px 7px 0 rgba(0,0,0,.5);transform:rotate(-1.2deg);margin:auto}
.memo::before{content:"";position:absolute;top:-13px;left:50%;width:120px;height:26px;background:rgba(255,255,255,.5);transform:translateX(-50%) rotate(2.5deg)}
.memo h1{font-weight:900;font-size:clamp(34px,9vw,48px);line-height:1.02;margin:0 0 6px}
.memo h2{font-weight:900;font-size:30px;line-height:1.1;margin:0 0 10px}
.memo p{margin:0 0 12px;font-size:15px;line-height:1.55}
.memo .hint{margin:18px 0 0;font-size:13px;color:#4d4424}
.ver{position:absolute;right:12px;bottom:8px;font-family:"DotGothic16",monospace;font-size:12px;color:#6b5f2a}
.wallet{display:inline-flex;align-items:center;gap:8px;font-family:"DotGothic16",monospace;font-size:20px;margin:4px 0 6px}
.coin{display:inline-block;width:14px;height:14px;background:var(--postit);box-shadow:inset -3px -3px 0 #c99a12,0 0 0 2px var(--ink)}
.memo .coin{background:#fff3b0}
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:18px;padding:12px 16px;margin:10px 0 0;background:var(--ink);color:var(--postit);border:0;box-shadow:4px 4px 0 rgba(0,0,0,.35);cursor:pointer;text-align:left}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.item:focus-visible,.floor:focus-visible,.sw:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.btn.small{font-size:14px;padding:8px 12px;width:auto;display:inline-block;margin:0}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row .btn{margin:0;flex:1}
.sheet{background:var(--paper);color:var(--ink);width:min(680px,100%);padding:22px 20px 20px;box-shadow:7px 7px 0 rgba(0,0,0,.5);margin:auto;border-top:14px solid #6b7688}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sheet h2{margin:0;font-weight:900;font-size:26px}
.sheet .lead{margin:4px 0 14px;font-size:14px;color:var(--muted)}
.list{display:grid;gap:10px}
.item{position:relative;display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:10px 12px;background:#fff;border:2px solid var(--ink);font:inherit;color:inherit;text-align:left;width:100%}
button.item{cursor:pointer}
.item img{height:auto;image-rendering:pixelated;display:block;margin:0 auto;max-width:76px}
.item h3{margin:0;font-size:17px;font-weight:900}
.item p{margin:3px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.item .stats{font-family:"DotGothic16",monospace;color:var(--ink)}
.item .btn{margin:0;width:auto;font-size:15px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.item .tag{font-size:14px;font-weight:900;white-space:nowrap}
.item.sel{outline:4px solid var(--postit);outline-offset:-1px}
.slotno{width:34px;height:34px;display:grid;place-items:center;font-family:"DotGothic16",monospace;font-size:20px;border:2px solid var(--ink);background:#fff}
.item.sel .slotno{background:var(--ink);color:var(--postit)}
.tier{display:inline-block;font-size:11px;font-weight:900;padding:1px 6px;margin-left:6px;vertical-align:2px;color:#fff;background:var(--tc)}
.t-rare{box-shadow:inset 0 0 0 3px #3a86ff}
.t-epic{box-shadow:inset 0 0 0 3px #9d4edd,0 0 14px rgba(157,78,221,.45);background:linear-gradient(135deg,#fff,#f3e8ff)}
.t-legend{box-shadow:inset 0 0 0 3px #ffb703,0 0 20px rgba(255,183,3,.6);background:linear-gradient(120deg,#fff8dc 0%,#fff 35%,#ffe8a3 50%,#fff 65%,#fff8dc 100%);background-size:250% 100%;animation:shine 3s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
.elevator{background:linear-gradient(#a3acba,#7f8a9b);color:var(--ink);width:min(360px,100%);padding:20px 22px 22px;margin:auto;border-radius:8px;box-shadow:inset 0 0 0 3px #5c6677,7px 7px 0 rgba(0,0,0,.5)}
.elevator .display{background:#0d0f14;color:#ff6a3d;font-family:"DotGothic16",monospace;font-size:22px;text-align:center;padding:10px 8px;margin-bottom:6px;min-height:50px;box-shadow:inset 0 0 0 3px #3a414f;text-shadow:0 0 8px rgba(255,106,61,.7)}
.elevator .boss{font-size:13px;text-align:center;margin:0 0 14px;min-height:20px;font-weight:900}
.floors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 10px}
.floor{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:0}
.floor .dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:"DotGothic16",monospace;font-size:19px;background:radial-gradient(circle at 35% 30%,#f4f6fa,#bcc4d0);box-shadow:inset 0 0 0 4px #5c6677,0 3px 0 #4a5362}
.floor small{font-size:11px;font-weight:900;line-height:1.2;text-align:center}
.floor.cur .dot{background:radial-gradient(circle at 35% 30%,#fff8d8,#ffd23f);box-shadow:inset 0 0 0 4px #b58a00,0 0 16px rgba(255,210,63,.9)}
.floor.done .dot{color:#2d6a1f}
.floor[disabled]{opacity:.45;cursor:not-allowed}
/* 員工證 */
.badge{background:#f7f7f2;color:var(--ink);width:min(640px,100%);padding:0;box-shadow:7px 7px 0 rgba(0,0,0,.5);margin:auto;border-radius:10px;overflow:hidden}
.badge .strap{height:34px;background:#1d3557;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;letter-spacing:.2em;font-size:13px}
.badge .body{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:18px}
@media (max-width:560px){.badge .body{grid-template-columns:1fr}}
.badge .photo{background:#dfe6ee;border:3px solid var(--ink);display:grid;place-items:center;aspect-ratio:1;position:relative}
.badge .photo canvas{width:100%;height:100%;image-rendering:pixelated}
.badge .photo .cap{position:absolute;bottom:0;left:0;right:0;background:var(--ink);color:#fff;font-size:12px;text-align:center;padding:3px}
.badge label{display:block;font-size:12px;font-weight:900;color:var(--muted);margin:10px 0 4px}
.badge input{font:inherit;font-size:18px;font-weight:900;width:100%;padding:8px 10px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:34px;height:34px;border:2px solid var(--ink);background:var(--c);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--postit);outline-offset:1px}
.opt{font:inherit;font-size:13px;font-weight:900;padding:6px 10px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.opt.on{background:var(--ink);color:var(--postit)}
.badge .foot{padding:0 18px 18px}
#lvl{position:fixed;inset:0;z-index:9;background:rgba(10,12,18,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));gap:12px;overflow:auto}
#lvl.hidden{display:none}
#sharem{position:fixed;inset:0;z-index:12;background:rgba(10,12,18,.8);display:flex;align-items:center;justify-content:center;padding:14px}
#sharem.hidden{display:none}
.shbox{background:var(--paper);border:3px solid var(--ink);padding:12px;max-width:min(460px,100%);max-height:100%;overflow:auto;box-shadow:7px 7px 0 rgba(0,0,0,.5)}
.shbox img{width:100%;display:block;border:2px solid var(--ink)}
.shbox .row{margin-top:10px}
#lvl h2{margin:0;color:#ffd23f;font-weight:900;font-size:clamp(24px,5vw,38px);text-shadow:3px 3px 0 #000;animation:fadeIn .25s}
#lvl .sub{margin:-6px 0 0;color:#eef0e8;font-size:14px}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:960px}
.cards.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:460px;width:100%}
@media (min-width:760px){.cards.four{display:flex;max-width:960px}}
.card{width:200px;max-width:100%;background:#f7f5ec;color:#1a1d27;border:3px solid #1a1d27;box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:0 0 12px;position:relative;cursor:pointer;text-align:left;font:inherit;animation:fadeIn .25s}
.cards.four .card{width:auto}
.card .hd{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--rc);color:#fff;font-size:12px;font-weight:900}
.card .hd .k{font-family:"DotGothic16",monospace;background:#fff;color:#1a1d27;padding:0 6px}
.card .ic{display:flex;align-items:center;gap:10px;padding:10px 12px 4px}
.card .ic img{width:44px;height:44px;image-rendering:pixelated;border:2px solid #1a1d27;background:#fff;flex:none}
.card h3{margin:0;font-size:16px;font-weight:900;line-height:1.2}
.card .lv{font-family:"DotGothic16",monospace;font-size:13px;color:#4a5160}
.card .lv b{color:#2d6a1f}
.card p{margin:6px 12px 0;font-size:13px;line-height:1.45}
.card .tag{display:inline-block;margin:8px 12px 0;font-size:11px;font-weight:900;padding:1px 6px;border:2px solid #1a1d27;background:#fff}
.card .st{position:absolute;right:10px;bottom:8px;transform:rotate(-12deg);border:3px solid #c1121f;color:#c1121f;font-weight:900;font-size:12px;padding:0 4px;opacity:.7}
.card:hover,.card:focus-visible{outline:4px solid #ffd23f;outline-offset:3px}
.lvbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lvbtns .btn{width:auto;margin:0;font-size:14px;padding:8px 14px;background:#eef0e8;color:#1a1d27;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.lvbtns .btn[disabled]{opacity:.4}
.hint2{color:#9aa3b5;font-size:12px}
@media (max-height:500px){#lvl{justify-content:flex-start;gap:8px}#lvl h2{font-size:22px}#lvl .sub{font-size:12px}.cards{gap:8px}.cards.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:100%}.card{padding-bottom:8px}.card .ic{padding:6px 10px 2px}.card .ic img{width:32px;height:32px}.card h3{font-size:14px}.card .lv{font-size:11px}.card p{font-size:12px;margin:4px 10px 0}.card .tag{margin:4px 10px 0}.card .st{display:none}}
.build{margin:6px 0 4px;font-weight:900}
.hrrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #b8a24a}
.hrrow h4{margin:0;font-size:15px;font-weight:900}
.hrrow p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.pips{display:inline-flex;gap:2px;margin-left:8px;vertical-align:middle}
.pips i{width:8px;height:12px;background:#d5d8cc;border:1px solid var(--ink)}
.pips i.on{background:#2d6a1f}
.hrrow .btn{margin:0;width:auto;font-size:15px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hrlock{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:900;color:#8a8f99;border:2px dashed #b8bcc6;padding:6px 10px;white-space:nowrap}
.item .hrlock{white-space:normal;max-width:132px;font-size:12px;line-height:1.35}
.item>*{min-width:0}
.hrlock .coin{filter:grayscale(1);opacity:.6}
.stamp{display:inline-block;transform:rotate(-8deg);border:2px solid #c1121f;color:#c1121f;font-weight:900;font-size:11px;padding:0 4px}
.heatbox{border:2px solid var(--ink);padding:10px 12px;margin:12px 0;background:#fff}
.heatbox label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
.heatbox input{width:16px;height:16px}
.heatbox .sum{font-weight:900;margin-top:6px}
.brow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed #b8a24a;font-size:13px}
.brow img{width:24px;height:24px;image-rendering:pixelated;border:2px solid #1a1d27;background:#fff}
/* 所有方向：長清單的標題列與底部按鈕固定 */
.sheet>header{position:sticky;top:calc(-18px - env(safe-area-inset-top,0px));z-index:3;background:var(--paper);margin:-22px -20px 0;padding:14px 20px 8px;border-bottom:2px solid #d5d8cc}
.sheet>.row:last-child{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:3;background:var(--paper);margin:10px -20px -20px;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid #d5d8cc}
/* 橫向手機 */
@media (orientation:landscape) and (max-height:560px){
  #screen{padding:8px 14px}
  .memo[aria-label="主選單"]{width:min(900px,100%);display:grid;grid-template-columns:320px 1fr 1fr;column-gap:14px;row-gap:8px;align-items:start;padding:18px 20px;transform:none}
  .memo[aria-label="主選單"]>canvas.title{grid-column:1;grid-row:1 / span 7;margin:0;width:100%}
  .memo[aria-label="主選單"]>p,.memo[aria-label="主選單"]>.wallet{grid-column:2 / 4;margin:0;font-size:13px}
  .memo[aria-label="主選單"]>.btn{margin:0;padding:9px 12px;font-size:15px}
  .memo[aria-label="主選單"]>.hint{grid-column:1 / 4;margin:4px 0 0;font-size:11px}
  .sheet{width:min(1000px,100%);border-top-width:8px;padding:12px 16px 14px}
  .sheet>header{margin:-12px -16px 0;padding:8px 16px 6px;top:-8px}
  .sheet>header h2{font-size:20px}
  .sheet .lead{font-size:12px;margin:6px 0 8px}
  .sheet .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .sheet .item{grid-template-columns:56px 1fr auto;gap:10px;padding:6px 10px}
  .sheet .item img{max-width:56px}
  .sheet .item h3{font-size:14px}.sheet .item p{font-size:12px;margin:2px 0 0}
  .sheet>.row:last-child{margin:8px -16px -14px;padding:8px 16px 8px;bottom:-8px}
  .sheet>.row:last-child .btn{padding:8px 12px;font-size:15px}
  .heatbox{columns:2;column-gap:16px}.heatbox .build,.heatbox .lbnote,.heatbox .sum{column-span:all}
}

.badge>.foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:3;background:#f7f5ec;border-top:2px solid #d5d8cc}
@media (orientation:landscape) and (max-height:560px){.badge>.foot{bottom:-8px}}

.badge{overflow:visible}
.elevator>.btn:last-child{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:3}
.memo[aria-label="設定"]>[data-act=menu]{grid-column:1 / -1}
@media (min-width:900px){.sheet{width:min(1000px,100%)}.sheet .list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:820px) and (max-height:900px),(orientation:landscape) and (max-height:560px){
  .memo[aria-label="主選單"]{width:min(900px,100%);display:grid;grid-template-columns:minmax(260px,340px) 1fr 1fr;column-gap:14px;row-gap:8px;align-items:start;padding:18px 20px;transform:none}
  .memo[aria-label="主選單"]{grid-auto-flow:row dense;align-items:stretch}
  .memo[aria-label="主選單"]>canvas.title{grid-column:1;grid-row:1 / span 2;margin:0;width:100%;align-self:start}
  .memo[aria-label="主選單"]>p:not(.hint){grid-column:1;grid-row:3 / span 2;margin:0;align-self:start;font-size:14px}
  .memo[aria-label="主選單"]>.wallet{grid-column:1;grid-row:5;margin:0;align-self:start}
  .memo[aria-label="主選單"]>.newfeat{grid-column:1 / 4}
  .memo[aria-label="主選單"]>.btn{margin:0;grid-column:auto;min-height:58px}
  .memo[aria-label="主選單"]>.hint{grid-column:1 / 4;margin:4px 0 0}
  .memo[aria-label="設定"]{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr;column-gap:14px;align-items:start;transform:none}
  .memo[aria-label="設定"]>h2,.memo[aria-label="設定"]>.hint{grid-column:1 / 3}
  .memo[aria-label="設定"]>.row,.memo[aria-label="設定"]>.btn{margin:6px 0 0}
}
@media (orientation:landscape) and (max-height:560px){
  .elevator>.btn:last-child{bottom:-8px}
  .memo>[data-act=menu]{position:sticky;bottom:-8px;z-index:3;background:var(--postit);box-shadow:inset 0 0 0 3px var(--ink),0 -12px 0 var(--postit),0 12px 0 var(--postit)}
  .elevator{width:min(760px,100%)}.elevator .floors{grid-template-columns:repeat(6,minmax(0,1fr))}
  .memo[aria-label="主選單"]>.btn{padding:9px 12px;font-size:15px}
  .memo[aria-label="主選單"]>p,.memo[aria-label="主選單"]>.wallet{font-size:13px}
  .badge{max-width:100%}
}
#touch{position:fixed;inset:0;z-index:2;touch-action:none}
#touch.hidden,#pauseBtn.hidden{display:none}
.tbtn{position:fixed;font:inherit;font-weight:900;color:var(--ink);background:var(--postit);border:0;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
#swapBtn{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;font-size:17px}
#actBtn{right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;font-size:14px;background:#7bdff2}
#actBtn.hidden{display:none}
#dodgeBtn{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(178px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;font-size:15px;background:#bde0fe}
#dodgeBtn.cd{opacity:.45}
.rtag{display:inline-block;margin-left:4px;font-size:10px;font-weight:900;color:#fff;padding:0 5px;vertical-align:1px}

const FF={cs:30,w:0,h:0,block:null,dist:null,key:'',t:0,q:null};
function ffBuild(){const g=G;FF.w=Math.ceil(WORLD.w/FF.cs);FF.h=Math.ceil(WORLD.h/FF.cs);const n=FF.w*FF.h;FF.block=new Uint8Array(n);FF.dist=new Int16Array(n);FF.q=new Int32Array(n);
  for(let cy=0;cy<FF.h;cy++)for(let cx=0;cx<FF.w;cx++){const x=cx*FF.cs+FF.cs/2,y=cy*FF.cs+FF.cs/2;if(x<30||y<30||x>WORLD.w-30||y>WORLD.h-30||inDesk(x,y,11,g.desks)||inDesk(x,y,11,g.walls))FF.block[cy*FF.w+cx]=1;}}
function ffUpdate(dt){const g=G,key=g.desks.length+'_'+g.walls.length;if(key!==FF.key||!FF.block){FF.key=key;ffBuild();FF.t=0;}
  FF.t-=dt;if(FF.t>0)return;FF.t=.25;const W=FF.w,H=FF.h,D=FF.dist,B=FF.block,Q=FF.q;D.fill(-1);
  let sx=clamp(Math.floor(g.player.x/FF.cs),0,W-1),sy=clamp(Math.floor(g.player.y/FF.cs),0,H-1);
  if(B[sy*W+sx]){let best=-1,bd=1e9;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const x=sx+dx,y=sy+dy;if(x<0||y<0||x>=W||y>=H||B[y*W+x])continue;const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=y*W+x;}}if(best<0)return;sx=best%W;sy=(best/W)|0;}
  let h=0,t=0;Q[t++]=sy*W+sx;D[sy*W+sx]=0;
  while(h<t){const c=Q[h++],cx=c%W,cy=(c/W)|0,dc=D[c]+1;
    for(let k=0;k<4;k++){const nx=cx+(k===0?1:k===1?-1:0),ny=cy+(k===2?1:k===3?-1:0);if(nx<0||ny<0||nx>=W||ny>=H)continue;const ni=ny*W+nx;if(B[ni]||D[ni]>=0)continue;D[ni]=dc;Q[t++]=ni;}}}
function ffAngle(x,y){if(!FF.dist)return null;const W=FF.w,H=FF.h,cx=clamp(Math.floor(x/FF.cs),0,W-1),cy=clamp(Math.floor(y/FF.cs),0,H-1),D=FF.dist;
  let here=D[cy*W+cx];let best=null,bd=here<0?32767:here;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const v=D[ny*W+nx];if(v<0)continue;
    if(dx&&dy&&(D[cy*W+nx]<0||D[ny*W+cx]<0))continue;const vv=v+(dx&&dy?.4:0);if(vv<bd){bd=vv;best=[nx,ny];}}
  if(!best)return null;return Math.atan2(best[1]*FF.cs+FF.cs/2-y,best[0]*FF.cs+FF.cs/2-x);}

function nearestEnemy(x,y,maxD){let best=null,bd=maxD*maxD;for(const e of G.enemies){if(e.dead)continue;const d2=(e.x-x)**2+(e.y-y)**2;if(d2<bd){bd=d2;best=e;}}return best;}

  for(const T of g.turrets){T.life-=dt;T.cd-=dt;if(T.cd<=0){let best=null,bd=380;for(const e of g.enemies){if(e.dead)continue;const dd=Math.hypot(e.x-T.x,e.y-T.y);if(dd<bd){bd=dd;best=e;}}if(best){const a=Math.atan2(best.y-T.y,best.x-T.x);T.a=a;g.bullets.push({x:T.x+Math.cos(a)*18,y:T.y-12+Math.sin(a)*18,vx:Math.cos(a)*720,vy:Math.sin(a)*720,dmg:T.dmg,pierce:T.sg>=3?2:0,life:.7,size:4,color:'#3a86ff',explode:0,kind:'',glow:'#3a86ff',slow:0,stun:0,kb:0,chain:0,homing:0,boom:0,t:0,hit:new Set(),spin:0,gun:'turret',sg:T.sg});T.cd=.22/(T.sg>=1?1.3:1);}else T.cd=.15;}}g.turrets=g.turrets.filter(T=>T.life>0);
  for(const S of g.smokes){S.t-=dt;S.tick=(S.tick||0)-dt;for(const e of g.enemies){if(e.dead)continue;if(Math.hypot(e.x-S.x,e.y-S.y)<S.r){e.slow=Math.max(e.slow,.2);e.smoked=.3;if(S.tick<=0)hurt(e,S.dps*.5,true);}}if(S.tick<=0)S.tick=.5;}g.smokes=g.smokes.filter(S=>S.t>0);
  for(const e of g.enemies)if(e.smoked>0)e.smoked-=dt;

function collect(it){
  const g=G,p=g.player;
  if(it.type==='coin'){g.coins+=it.value*p.st.coin*(g.ob&&g.ob.angel?1.1:1)*(g.cp&&g.cp.sales?1.25:1)*(g.def.endless?Math.max(ENDLESS_BAL.coinMin,1-ENDLESS_BAL.coinDecay*hellM()):1);sfx((fun('register')&&!g.daily)?'register':'coin');}
  else if(it.type==='buff'){if(it.sub==='shield'){p.shield=Math.min(p.shield+1,5);}else p.tbuff={k:it.sub,t:10};toast(BUFF_NAME[it.sub]+(it.sub==='shield'?'':'（10 秒）'),1.6);sfx('power');}
  else if(it.type==='heal'){const hv=Math.round((30+(p.st.healBonus||0))*(g.cp&&g.cp.teaRoom?1.5:1));p.hp=Math.min(p.maxHp,p.hp+healMul()*hv);floatText(p.x,p.y-30,'+'+hv+' 便當','#8fd14f',14);sfx('power');}
  else if(it.type==='xp'){gainXp((g.xpMul||1)*it.value/(1+g.diff*.12)*(g.def.endless?(g.hell?.3:.6):1));}
  else if(it.type==='raise'){g.pendingLv++;g.raiseNext=true;toast('加薪通知！這次升等是四選一',1.6);tipOnce('raise','加薪通知：四選一，保證至少一張稀有卡');sfx('power');}
  else if(it.type==='gun'){const st=crateStatus(it),i=p.slots.findIndex(s=>s.id===it.id);
    if(st==='up'){g.pendingLv++;g.gunNext=it.id;toast(GUNS[it.id].name+' 的強化卡');sfx('upgrade');}else{g.coins+=20;toast(GUNS[it.id].name+' 已滿級，換成 20 金幣');sfx('power');}}
}

function cardPool(kind,gunId){

    for(const s of p.slots){const u=p.gunUp[s.id]||{};for(const k of ['dmg','rate']){if((u[k]||0)<WCARDS[k].max)pool.push({t:'w',id:k,gun:s.id,w:.45});}

function pickOffer(kind,gunId){

  if(kind==='raise'){const rare=pool.filter(c=>(c.t==='c'?CARDS[c.id].rar:WCARDS[c.id].rar)!=='common');if(rare.length){const c=rare[Math.floor(rnd()*rare.length)];out.push(c);pool=pool.filter(x=>x!==c);}}
  while(out.length<n&&pool.length){let tot=pool.reduce((a,c)=>a+c.w,0),r=rnd()*tot,c=pool[0];for(const x of pool){r-=x.w;if(r<=0){c=x;break;}}out.push(c);pool=pool.filter(x=>x!==c);}

Climb.resume=function(){if(!save.climb)return;if(save.climb.rv!==2){cClear();Climb.entry();return;}Climb.st=JSON.parse(JSON.stringify(save.climb));const ph=Climb.st.phase;G=null;mode='menu';if(ph==='draft')Climb.renderDraft();else if(ph==='shop')Climb.renderShop();else if(ph==='elev')Climb.renderElevator();else Climb.goFloor();};

Climb.rollRewards=function(){const st=Climb.st,z=cZone(st.route[st.route.length-1]),r=cRng('rw'+st.rwRoll),w=CLIMB_CONFIG.rarity[z],up=st.floorRarityUp||0,out=[],used=new Set();
  const rollRar=()=>{let tot=0;for(const k of RAR_ORDER)tot+=w[k];let x=r()*tot,rr='common';for(const k of RAR_ORDER){x-=w[k];if(x<=0){rr=k;break;}}let i=RAR_ORDER.indexOf(rr)+up;const cap=st.step===0?1:z>=3?3:2;return RAR_ORDER[Math.min(i,cap)];};

  const reach=G_.swing?(G_.swing.reach||80):0,rng=(G_.life||0)*(G_.speed||0);const dist=reach?b.r+reach*.55:(rng&&rng<300?Math.max(70,rng*.5):200);
  b.x=clamp(p.x+dist,60,WORLD.w-60);b.y=p.y;b.fx=b.x;b.fy=b.y;b.px=p.x;b.py=p.y;return b;}
function devBench(){const c=DevCfg,list=c.bench.filter(Boolean);if(!list.length){c.benchRes={rows:[],note:'請至少選一把武器。'};renderDev();return;}
  c.benchRes={rows:[],n:list.length,running:true,target:c.benchTarget};renderDev();let i=0;
  const step=()=>{const MR=Math.random;const gid=list[i++];let row;
    try{Math.random=seeded(hashStr('bench'+gid));const bak=save.outfit;save.outfit=c.outfit;DEV_STARTING=true;try{startRun(c.floor,[gid],{dev:true});}finally{DEV_STARTING=false;save.outfit=bak;}
      const keep=JSON.parse(JSON.stringify(DevCfg));Object.assign(DevCfg,{g1:gid,g2:'',god:true,noSpawn:true});devApply(G);Object.assign(DevCfg,keep);
      const g=G,p=g.player;g.enemies.length=0;let boss=null,still=null;if(c.benchTarget==='dummy')devDummy();else if(c.benchTarget==='still'){still=benchStillBoss(gid,c.benchBoss);}else if(c.benchTarget==='boss')boss=devSpawnBoss(c.benchBoss,1);else{for(let k=0;k<30;k++)spawnEnemy('walker',{x:clamp(p.x+rand(120,320)*(k%2?1:-1),40,WORLD.w-40),y:clamp(p.y+rand(-200,200),40,WORLD.h-40)});}
      const lim=c.benchTarget==='boss'?60:c.benchSec;let t=0,ttk=null;while(t<lim){if(still){still.x=still.fx;still.y=still.fy;still.pcd=1e9;p.x=still.px;p.y=still.py;}update(1/60);t+=1/60;g.intro=null;if(still){for(const e of g.enemies)if(e!==still)e.dead=true;g.enemies=g.enemies.filter(e=>e===still);g.bosses=g.bosses.filter(b=>b===still);}if(g.offer){g.pendingLv=0;closeCards();mode='play';}if(boss&&boss.dead){ttk=t;break;}if(g.dead||!G)break;}
      const el=c.benchTarget==='boss'?(ttk||t):t;row={g:gid,dps:g.dev.total/Math.max(.5,el),total:g.dev.total,ttk,kills:p.kills};}
    catch(e){row={g:gid,dps:0,total:0,ttk:null,kills:0};console.error(e);}
    finally{Math.random=MR;G=null;mode='menu';}
    c.benchRes.rows.push(row);if(i>=list.length)c.benchRes.running=false;renderDev();if(i<list.length)setTimeout(step,30);};
  setTimeout(step,30);}

function reportError(kind,msg,stack){try{
  if(!save||!save.settings||!save.settings.telemetry)return;
  msg=String(msg||'unknown').slice(0,300);const st=String(stack||'').split('\n').slice(0,6).map(l=>l.replace(/\(?(https?|file):\/\/[^)\s]*\/([^/)\s]+)/g,'$2').trim()).join('\n').slice(0,1000);
  const sig=kind+'|'+msg+'|'+(st.split('\n')[1]||'');if(ERR_SENT.has(sig))return;ERR_SENT.add(sig);
  const now=Date.now();ERR_TIMES=ERR_TIMES.filter(t=>now-t<5000);ERR_TIMES.push(now);if(ERR_TIMES.length>=3&&G&&G.toasts){try{toast('遊戲發生錯誤，已自動回報，建議重新開啟',3);}catch(e){}}
  const day=new Date().toISOString().slice(0,10);let cnt={};try{cnt=JSON.parse(localStorage.getItem('zo_err_day')||'{}');}catch(e){}if(cnt.d!==day)cnt={d:day,n:0};if(cnt.n>=20)return;cnt.n++;localStorage.setItem('zo_err_day',JSON.stringify(cnt));
  const body={device:save.device,version:VERSION,platform:platformTag(),kind,message:msg,stack:st||null,context:errCtx()};
  errSendBody(body).catch(()=>{const q=errQueue();if(q.length<5){q.push(body);localStorage.setItem('zo_err_q',JSON.stringify(q));}});
}catch(e){}}
function errFlush(){const q=errQueue();if(!q.length||!save.settings.telemetry)return;localStorage.removeItem('zo_err_q');q.forEach((b,i)=>setTimeout(()=>errSendBody(b).catch(()=>{}),i*9000));}

function renderRedeem(){show('<div class="memo fb" role="dialog" aria-label="兌換碼"><h2>兌換碼</h2><p class="hint" style="margin:0">輸入兌換碼，領取限定獎勵</p><label class="fbl">兌換碼<input id="rcode" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" value="'+esc(REDEEM.code)+'" placeholder="ANGEL-XXXX-XXXX-XXXX" style="font-size:20px;letter-spacing:2px;text-align:center"></label><p class="fbmsg" id="rmsg">'+esc(REDEEM.msg)+'</p><div class="row"><button class="btn" data-act="redeemGo"'+(REDEEM.busy?' disabled':'')+'>'+(REDEEM.busy?'兌換中…':'兌換')+'</button><button class="btn ghost" data-act="redeemBack">返回</button></div><p class="hint" style="margin-top:10px">兌換需要網路連線。獎勵會存在這台裝置，換手機前請先使用「存檔轉移」。</p></div>','#rcode');

function renderRedeemOk(){const ic=outfitIcon('angel');show('<div class="memo" role="dialog" aria-label="兌換成功" style="text-align:center"><h2 style="color:#b8860b">恭喜成為天使投資人！</h2><div class="rokbox"><div class="rokflash"></div><img class="rokimg" src="'+ic+'" alt="" style="width:240px;max-width:90%;image-rendering:pixelated"></div><p><b>天使投資人</b>（兌換限定服裝）</p><p style="font-size:13px">技能「天使輪」：閃避落地時展開光環，震開身邊的殭屍；金幣 +10%</p><p style="font-size:13px">獲得職稱 <span class="ttag angel">天使投資人</span></p><div class="row"><button class="btn" data-act="redeemWear">立刻換上</button><button class="btn ghost" data-act="redeemBack">之後再說</button></div></div>','[data-act=redeemWear]');sfx('clear');}
Object.assign(ACTIONS,{
  redeem:()=>{REDEEM={code:'',busy:false,msg:''};renderRedeem();syncRewards(true);},
  redeemBack:()=>{renderSettings();},
  redeemWear:()=>{if(save.outfits.includes('angel')){save.outfit='angel';persist();}renderWardrobe('angel');},
  redeemGo:()=>{if(REDEEM.busy)return;const code=(($('#rcode')||{}).value||REDEEM.code||'').trim();REDEEM.code=code;if(code.replace(/[^A-Za-z0-9]/g,'').length<6){REDEEM.msg=REDEEM_MSG.invalid;renderRedeem();return;}
    REDEEM.busy=true;REDEEM.msg='';renderRedeem();
    fetch(LB.url+'/rest/v1/rpc/redeem_code',{method:'POST',headers:{'Content-Type':'application/json',apikey:LB.key,Authorization:'Bearer '+LB.key},body:JSON.stringify({code,dev:save.device})})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
      .then(res=>{REDEEM.busy=false;if(res&&res.ok){grantReward(res.reward);renderRedeemOk();return;}if(res&&res.err==='owned'){grantReward(res.reward||'angel');}REDEEM.msg=REDEEM_MSG[(res&&res.err)||'invalid']||REDEEM_MSG.invalid;renderRedeem();})
      .catch(()=>{REDEEM.busy=false;REDEEM.msg=REDEEM_MSG.net;renderRedeem();});},
});

const ANGEL_WING=["#.........","#W#.......","#WW##.....","#WWWW##...",".#WWgWW##.",".#WWWgWWW#","..#WWWgWWW","..#WWWWgWW","...#WWWWWW","....##WWW#","......###."];
const ANGEL_COL={'#':'#0d0f14','W':'#fafaf6','g':'#c6ceda'};
function angelWing(c,ox,oy,u,mirror,up){for(let r=0;r<ANGEL_WING.length;r++){const row=ANGEL_WING[r];for(let k=0;k<row.length;k++){const ch=row[k];if(ch==='.')continue;const cc=mirror?row.length-1-k:k;const dy=(up&&k<5)?-u:0;c.fillStyle=ANGEL_COL[ch];c.fillRect(ox+cc*u,oy+r*u+dy,u,u);}}}
const ANGEL_HALO=[".LLLLLL.","Y......Y",".DDDDDD."];const ANGEL_HALO_COL={L:'#fff1a8',Y:'#ffd23f',D:'#d9a520'};
function angelHalo(c,cx,y,u){const x0=cx-4*u,y0=y-2*u;for(let r=0;r<3;r++)for(let k=0;k<8;k++){const ch=ANGEL_HALO[r][k];if(ch==='.')continue;c.fillStyle=ANGEL_HALO_COL[ch];c.fillRect(x0+k*u,y0+r*u,u,u);}}
function angelSpark(c,x,y,u,a){c.globalAlpha=a;c.fillStyle='#ffe58a';c.fillRect(x,y,u,u);c.fillRect(x-u,y+u,3*u,u);c.fillRect(x,y+2*u,u,u);c.globalAlpha=1;}
const ANGEL_ICON_CACHE={};
function angelIcon(ch){ch=ch||save.char;const key=charKey(ch,'angel',1,true);if(ANGEL_ICON_CACHE[key])return ANGEL_ICON_CACHE[key];
  const body=charSprite(ch,'angel',1,true).img,U=5,Wu=body.width+16,Hu=body.height+3,cv=document.createElement('canvas');cv.width=Wu*U;cv.height=Hu*U;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
  const bx=8*U,by=3*U;angelWing(c,bx-8*U,by+3*U,U,false,false);angelWing(c,bx+(body.width-2)*U,by+3*U,U,true,false);c.drawImage(body,bx,by,body.width*U,body.height*U);angelHalo(c,bx+body.width*U/2,by-U,U);
  angelSpark(c,1*U,3*U,U,1);angelSpark(c,(Wu-3)*U,6*U,U,.9);angelSpark(c,3*U,(Hu-5)*U,U,.8);
  return ANGEL_ICON_CACHE[key]=cv.toDataURL();}
function angelIconCard(ch){const full=angelIcon(ch);if(ANGEL_ICON_CACHE['card'+full.length])return ANGEL_ICON_CACHE['card'+full.length];return full;}
function angelCardIcon(){const key='card'+charKey(save.char,'angel',1,true);if(ANGEL_ICON_CACHE[key])return ANGEL_ICON_CACHE[key];const body=charSprite(save.char,'angel',1,true).img,U=5,Wu=16,Hu=body.height+1,cv=document.createElement('canvas');cv.width=Wu*U;cv.height=Hu*U;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;const bx=2*U,by=U;angelWing(c,bx-8*U,by+3*U,U,false,false);angelWing(c,bx+(body.width-2)*U,by+3*U,U,true,false);c.drawImage(body,bx,by,body.width*U,body.height*U);angelHalo(c,bx+body.width*U/2,by+U,U);return ANGEL_ICON_CACHE[key]=cv.toDataURL();}
function angelBox(p){const sc=p.scale||3;return {u:sc,bx:p.x-6*sc,by:p.y+14*sc*.38-17*sc};}
function drawAngelBack(p){if(save.outfit!=='angel'||!G||!G.ob||!G.ob.angel||G.dead)return;const {u,bx,by}=angelBox(p),mv=!!(p.mx||p.my),up=mv?Math.floor(G.time/.12)%2===0:Math.floor(G.time/.6)%2===0;ctx.save();angelWing(ctx,Math.round(bx-8*u),Math.round(by+3*u),u,false,up);angelWing(ctx,Math.round(bx+10*u),Math.round(by+3*u),u,true,up);ctx.restore();}
function drawAngelFront(p){if(save.outfit!=='angel'||!G||!G.ob||!G.ob.angel||G.dead)return;const {u,bx,by}=angelBox(p);const bob=Math.round(Math.sin(G.time*3)*u*.6);ctx.save();angelHalo(ctx,Math.round(p.x),Math.round(by-u*1.5+bob),u);ctx.restore();
  if((p.mx||p.my)&&Math.random()<.06&&G.parts&&G.parts.length<400)G.parts.push({x:p.x+rand(-14,14)*u/3,y:by+rand(4,12)*u,vx:rand(-20,20),vy:-30,life:.5,max:.5,color:'#ffe58a',size:3});
  if(p.angelFx>0){const a=p.angelFx/.45,r=95*(1-a)+20;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(p.x,p.y+p.r*.6,r,r*.45,0,0,TAU);ctx.stroke();ctx.restore();}}

function empRpc(fn,body){return fetch(LB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:LB.key,Authorization:'Bearer '+LB.key},body:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});}
const EMP={busy:false,msg:'',conflict:false};
function empNextText(){const n=save.emp&&save.emp.next;if(!n)return '';const d=new Date(n);return (d.getMonth()+1)+'/'+d.getDate();}
function empCanEdit(){const n=save.emp&&save.emp.next;return !n||Date.now()>=new Date(n).getTime();}
function empApply(r){if(!r||!r.ok)return;save.emp=Object.assign(save.emp||{},{no:r.no,hired:r.hired,next:r.next_change||null,srvName:r.name||null});persist();}
function empSync(){if(!save.device)return Promise.resolve();return empRpc('register_employee',{dev:save.device}).then(r=>{empApply(r);const local=(save.char.name||'').trim();
  if(r.name&&r.name!==save.char.name){save.char.name=r.name;persist();}
  else if(!r.name&&local&&save.seenBadge){return empRpc('set_employee_name',{dev:save.device,nm:local}).then(x=>{if(x.ok){save.emp.srvName=x.name;persist();}else if(x.err==='taken'||x.err==='bad'){EMP.conflict=true;EMP.msg=x.err==='taken'?'「'+local+'」已經有人使用了，請換一個新名字（這次修改不受 7 天限制）':'這個名字不能使用，請換一個。';if(mode==='menu'&&!G)renderBadge();}});}
  if($('#pv'))empRefreshCard();}).catch(()=>{});}
function empRefreshCard(){const no=$('#empno'),hd=$('#emphired');if(no)no.textContent=save.emp&&save.emp.no!=null?String(save.emp.no).padStart(6,'0'):'報到中…';if(hd)hd.textContent=save.emp&&save.emp.hired||'—';}
function empSetName(nm){nm=(nm||'').trim().slice(0,12);if(!nm){save.char.name='';persist();return Promise.resolve(true);}
  if(nm===save.char.name&&!EMP.conflict&&save.emp&&save.emp.srvName===nm)return Promise.resolve(true);
  EMP.busy=true;EMP.msg='檢查名字中…';empMsg();
  return empRpc('set_employee_name',{dev:save.device,nm}).then(r=>{EMP.busy=false;
    if(r.ok){save.char.name=r.name;EMP.conflict=false;EMP.msg='';persist();return empRpc('register_employee',{dev:save.device}).then(x=>{empApply(x);empMsg();return true;});}
    EMP.msg=r.err==='taken'?'這個名字已經有人使用了，請換一個。':r.err==='cooldown'?'姓名每 7 天才能修改一次，下次可修改：'+((d=>(d.getMonth()+1)+'/'+d.getDate())(new Date(r.next_change))):r.err==='bad'?'這個名字不能使用，請換一個。':'這個名字不能使用，請換一個。';
    if(r.next_change){save.emp=Object.assign(save.emp||{},{next:r.next_change});persist();}empMsg();return false;})
   .catch(()=>{EMP.busy=false;EMP.msg='修改姓名需要網路連線，請稍後再試。';empMsg();return false;});}
function empMsg(){const el=$('#nmmsg');if(el)el.textContent=EMP.msg||(!EMP.conflict&&!empCanEdit()?'姓名每 7 天才能修改一次，下次可修改：'+empNextText():'');}

const SCYTHE_PX=(()=>{const o=[];const st='#96704a',ed='#0d0f14',bl='#dce2ec',rd='#e63946';
  for(let i=0;i<20;i++){const x=3+Math.floor(i*11/19),y=21-i;o.push([x-4,y-5,st]);o.push([x-5,y-5,ed]);}
  for(const [x,y] of [[14,2],[13,1],[12,1],[11,1],[10,1],[9,2],[8,2],[7,3],[6,4],[5,5],[13,2],[12,2],[11,2],[10,2],[9,3],[8,3],[7,4]])o.push([x-4,y-5,bl]);
  for(const [x,y] of [[9,0],[10,0],[11,0],[12,0],[13,0],[14,1],[15,2]])o.push([x-4,y-5,ed]);
  for(const [x,y] of [[9,3],[8,3],[7,4],[6,5],[5,6]])o.push([x-4,y-5,rd]);return o;})();
function drawScythe(c,bx,by,u){for(const [dx,dy,col] of SCYTHE_PX){c.fillStyle=col;c.fillRect(bx+dx*u,by+dy*u,u,u);}}

  if(!WARDSEL||!OUTFITS[WARDSEL])WARDSEL=save.outfit;
  const st=id=>{const o=OUTFITS[id];if(save.outfit===id)return ['穿著中','on'];if(save.outfits.includes(id))return ['✓ 已擁有','own'];if(o.redeem)return ['兌換碼','lk'];const rf=rewardFloorOf('o',id);if(rf!==null)return ['打穿 '+LEVELS[rf].floor+' 取得','lk'];if(!tierOpen(o.tier))return ['打完 '+TIER_FLOOR[o.tier]+' 開放','lk'];return ['<i class="coin"></i>'+o.price.toLocaleString(),save.coins>=o.price?'buy':'poor'];};
  const tiles=list.map(id=>{const o=OUTFITS[id],s=st(id);return invTile({id,tier:o.tagTier||o.tier,sel:id===WARDSEL,locked:s[1]==='lk',act:'wardSel',img:outfitIcon(id),name:o.name,st:s[0],stc:s[1]});}).join('');
  const id=WARDSEL,o=OUTFITS[id],s=st(id),rf=rewardFloorOf('o',id),big=id==='angel'?angelCardIcon():outfitIcon(id);
  const btn=s[1]==='on'?'<button class="ibtn off on" disabled>穿著中</button>':s[1]==='own'?'<button class="ibtn" data-act="wear" data-arg="'+id+'">換上</button>':o.redeem?'<button class="ibtn off" data-act="redeem">輸入兌換碼取得</button>':rf!==null?'<button class="ibtn off" disabled>打穿 '+LEVELS[rf].floor+' 取得</button>':!tierOpen(o.tier)?'<button class="ibtn off" disabled>打完 '+TIER_FLOOR[o.tier]+' 開放</button>':'<button class="ibtn" data-act="buyOutfit" data-arg="'+id+'"'+(save.coins<o.price?' disabled':'')+'>'+(save.coins<o.price?'金幣不足　':'購買　')+'<i class="coin"></i>'+o.price.toLocaleString()+'</button>';
  const det='<div class="idet wd" style="--tc:'+TIERS[o.tagTier||o.tier].color+'"><div class="ibig pv"><img src="'+big+'" alt=""></div><div class="ihd"><h3>'+esc(o.name)+'</h3><div class="itags">'+tierTag(o.tagTier||o.tier)+'</div><p class="idesc">'+esc(o.desc)+'</p></div>'+btn+'</div>';
  const n=all.length,no=all.filter(i=>save.outfits.includes(i)).length;
  show('<div class="sheet inv2 ward" role="dialog" aria-label="更衣室">'+invHead('更衣室')+'<div class="ibody">'+det+invChips([['全部','全部 '+n],['已擁有','已擁有 '+no],['普通','普通'],['稀有','稀有'],['史詩','史詩'],['傳說','傳說']],F,'wardF')+'<div class="igrid">'+(tiles||'<p class="inote">這個分類目前沒有服裝</p>')+'</div></div></div>','.it.sel');
}

Object.assign(ACTIONS,{
  shopSel:a=>{SHOPSEL=a;sfx('ui');renderShop();const d=$('#screen .idet');if(d&&innerWidth<880)d.scrollIntoView({block:'nearest',behavior:'smooth'});},
  wardSel:a=>{WARDSEL=a;sfx('ui');renderWardrobe();const d=$('#screen .idet');if(d&&innerWidth<880)d.scrollIntoView({block:'nearest',behavior:'smooth'});},
  wardF:a=>{WARDF=a;sfx('ui');renderWardrobe();},
  climbGo:()=>{if(!climbOpen())return;if(save.climb){Climb.renderContinue();return;}Climb.entry();},
  lockMsg:a=>{sfx('ui');toastMenu(a==='無限加班'?'打穿 RF 頂樓天台就會開放「無限加班」':'打穿 5F 財務部就會開放「爬樓」');}
});

/* ================= v0.29.1 第三批：選擇樓層、選槍、暫停、結算 ================= */
function renderLevels(){
  if(ESEL===null||ESEL==='climb'||ESEL===11||(typeof ESEL==='number'&&ESEL===19&&!floorOpen(19)))ESEL=nextFloor();if(ESEL===11)ESEL=10;
  const wide=eWide();if(EBANK===null||(typeof ESEL==='number'&&!BANKS[EBANK].includes(ESEL)))EBANK=BANKS[1].includes(ESEL)?1:0;
  const vis=BANKS[EBANK].filter(i=>i!==11&&(i!==19||floorOpen(19))),cols=3,rows=[];for(let k=vis.length;k>0;k-=cols)rows.push(vis.slice(Math.max(0,k-cols),k));
  const grid=rows.map(r=>r.map(i=>{const st=eState(i);return '<button class="ebtn '+st+(ESEL===i?' sel':'')+'" data-act="eSel" data-arg="'+i+'" aria-label="'+LEVELS[i].floor+' '+esc(LEVELS[i].name)+'">'+LEVELS[i].floor+'</button>';}).join('')+(r.length<cols?'<span></span>'.repeat(cols-r.length):'')).join('');
  const i=ESEL,L=LEVELS[i],open=floorOpen(i),done=save.cleared.includes(i),it=rewardItem(i),go=eCanGo();
  const boss=L.boss==='board'?'董事會':BOSSES[L.boss]?BOSSES[L.boss].name:'—',tip=FLOOR_TIP[L.floor]&&L.floor!=='4F'?FLOOR_TIP[L.floor]:'';
  const led='<div class="eled"><b>'+L.floor+'　'+esc(L.name)+'</b><span>'+(open?'魔王：'+esc(boss)+(tip?'　機制：'+esc(tip.split(/[，。；]/)[0]):''):esc(reqText(i)))+'</span></div>';
  const panel='<div class="epanel2"><div class="ebanks2"><button class="'+(EBANK===0?'on':'')+'" data-act="eBank" data-arg="0">低樓層 B1–10F</button><button class="'+(EBANK===1?'on':'')+'" data-act="eBank" data-arg="1">高樓層 12F–RF</button></div>'+led+'<div class="egrid2">'+grid+'</div>'+
    '<div class="ekeys"><button class="ekey" data-act="menu"><i>◀▶</i><small>開門・返回</small></button><button class="ekey go" data-act="eGo"'+(go?'':' disabled')+'><i>▶◀</i><small>關門・出發</small></button></div></div>';
  const rw=it?'<img src="'+(it.t==='g'?gunIcon(it.id):outfitIcon(it.id))+'" alt="">'+((it.t==='g'?save.guns:save.outfits).includes(it.id)?'✓ ':'')+esc(it.name):'—';
  const info=wide?'<div class="einfo2 w"><h3>'+L.floor+' '+esc(L.name)+(L.side?'<small>支線</small>':'')+'</h3><dl><dt>魔王</dt><dd>'+esc(boss)+'</dd><dt>機制</dt><dd>'+esc(tip||'—')+'</dd><dt>首次通關</dt><dd class="erw2">'+rw+'</dd><dt>你的最佳</dt><dd>'+(save.best[i]?fmtT(save.best[i])+(save.heatBest[i]?'　強度 '+save.heatBest[i]:''):done?'✓ 已通關':'還沒通關')+'</dd></dl><p class="enote">'+(done?'加班強度：出發前可以在選槍畫面設定（拿更多金幣）':'加班強度：通關後開放（拿更多金幣）')+'</p><button class="ego2" data-act="eGo"'+(go?'':' disabled')+'>'+(open?'關門・出發 ▶　選兩把槍':esc(reqText(i)))+'</button><p class="ekb">鍵盤：方向鍵選樓層、Enter 出發、Esc 返回</p></div>'
    :'<div class="einfo2"><p class="erw2"><b>首次通關獎勵：</b>'+rw+'</p><p>'+(done?'✓ 已通關'+(save.best[i]?'　最佳 '+fmtT(save.best[i]):''):'加班強度：通關後開放（拿更多金幣）')+'</p><p class="ey">'+(open?'按「關門・出發」→ 選兩把槍':esc(reqText(i)))+'</p><p class="elg">綠圈＝已通關　黃圈＝下一層　紫圈＝支線樓層　灰色＝未開放</p></div>';
  show('<div class="sheet elev2'+(wide?' wide':'')+'" role="dialog" aria-label="選擇樓層"><header><button class="hback" data-act="menu">‹ 返回</button><h2>選擇樓層</h2>'+coinTag(save.coins)+'</header><div class="ebody2">'+panel+info+'</div></div>',go?'[data-act=eGo]':'.ebtn.sel');
}
let LOF='全部';
function renderLoadout(focusId){
  const L=LEVELS[pendingLv],canHeat=!pendingClimb&&!L.endless&&!L.survival&&save.cleared.includes(pendingLv),best=save.heatBest[pendingLv]||0,sel=(save.heatSel[pendingLv]||[]).filter(k=>HEAT[k]),pts=heatPts(sel),cap=best+2;
  const heatBox=canHeat?'<div class="lheat"><b>加班強度（可選，換更多金幣）</b><p>這層最高通關強度 '+best+'，目前最多可開到 '+cap+' 點。</p><div class="lhl">'+Object.entries(HEAT).map(([k,h])=>{const on=sel.includes(k),dis=!on&&pts+h.pts>cap;return '<label class="'+(on?'on':'')+(dis?' dis':'')+'"><input type="checkbox" data-heat="'+k+'"'+(on?' checked':'')+(dis?' disabled':'')+'> '+esc(h.name)+'<span class="pix">'+h.pts+'</span></label>';}).join('')+'</div><p class="lsum">合計 '+pts+' 點　金幣 ×'+(1+.15*pts).toFixed(2)+'</p></div>':'';
  const owned=byTier(save.guns.filter(id=>GUNS[id]),GUNS),F=LOF;
  const list=owned.filter(id=>F==='全部'||(F==='近戰'?!!GUNS[id].swing:ROLES[id]&&ROLES[id][0]===F));
  const tiles=list.map(id=>{const g=GUNS[id],k=pickSel.indexOf(id);return '<button class="it'+(k>=0?' sel':'')+'" style="--tc:'+TIERS[g.tier].color+'" data-act="toggleGun" data-arg="'+id+'" aria-pressed="'+(k>=0)+'"><span class="iti"><img src="'+gunIcon(id)+'" alt=""></span><b>'+esc(g.name)+'</b><span class="ist own">'+esc(gunStyle(id).tags)+'</span>'+(k>=0?'<em class="lno">'+(k+1)+'</em>':'')+'</button>';}).join('');
  const slot=k=>{const id=pickSel[k];return '<div class="lslot'+(id?' on':'')+'"><span class="lsn">'+(k+1)+' 號</span>'+(id?'<img src="'+gunIcon(id)+'" alt=""><b>'+esc(GUNS[id].name)+'</b>':'<em>還沒選</em>')+'</div>';};
  const pn=pairNote().replace('<p class="pairnote">','').replace('</p>','');
  const dest=pendingClimb?'安全梯・爬樓':L.endless?'∞ 無限加班':L.floor+' '+L.name;
  const cta=pickSel.length<2?'再選 '+(2-pickSel.length)+' 把槍':(pendingClimb?'開始爬樓 ▶':'開始上班 ▶　'+esc(dest));
  show('<div class="sheet inv2 lo2" role="dialog" aria-label="選擇槍枝"><header><button class="hback" data-act="levels">‹ 返回</button><h2>選兩把槍</h2>'+coinTag(save.coins)+'</header><div class="lbody"><p class="lnote">第一把是 1 號槍。地上的綠色槍箱會升級，橘色可以換槍。</p><div class="lslots">'+slot(0)+slot(1)+'</div>'+(pn?'<p class="lpair">✓ '+pn+'</p>':'<p class="lpair off">選好兩把後，會顯示這個組合的特色。</p>')+
    invChips([['全部','全部 '+owned.length],['清群','清群'],['單體','單體'],['近戰','近戰']],F,'loF')+'<div class="igrid">'+tiles+'</div>'+heatBox+'</div><div class="lcta"><button class="ibtn" data-act="start"'+(pickSel.length<2?' disabled':'')+'>'+cta+'</button></div></div>',focusId?'[data-arg="'+focusId+'"]':null);
  scr.querySelectorAll('input[data-heat]').forEach(cb=>cb.addEventListener('change',()=>{const k=cb.dataset.heat;let s=(save.heatSel[pendingLv]||[]).filter(x=>HEAT[x]&&x!==k);if(cb.checked)s.push(k);save.heatSel[pendingLv]=s;persist();renderLoadout();}));
}
function pauseGame(){if(mode!=='play')return;mode='paused';controlsUI(false);$('#actBtn').classList.add('hidden');MUSIC.duck=.35;musicGain();
  show('<div class="memo pause2" role="dialog" aria-label="暫停"><h2>暫停</h2><div class="pst"><div><span>時間</span><b>'+fmtT(Math.floor(G.time))+'</b></div><div><span>擊倒</span><b>'+G.player.kills+'</b></div><div><span>金幣</span><b>+'+Math.floor(G.coins)+'</b></div></div><p class="pnote">現在早退，這局的金幣會保留。</p><button class="ibtn" data-act="resume">繼續上班 ▶</button><button class="pbtn" data-act="pauseSettings">設定（聲音、畫面）</button><button class="pbtn red" data-act="quit">早退回主選單</button><button class="linkbtn" data-act="feedback">回報問題</button></div>');}
function resultScreen(o){
  return '<div class="memo res2" role="dialog" aria-label="結算"'+(o.beach?' style="background:linear-gradient(#8ecae6 0 45%,#f4e3c1 45% 100%)"':'')+'><h1 class="'+(o.good?'good':'bad')+'">'+o.title+'</h1><p class="rsub">'+o.sub+'</p>'+(o.badge?'<span class="rbadge">'+o.badge+'</span>':'')+
    '<div class="rstats">'+o.stats.map(([k,v])=>'<div><span>'+k+'</span><b>'+v+'</b></div>').join('')+'</div><div class="rcoin"><span>本局金幣</span><b><i class="coin"></i>+'+o.earned+'</b>'+(o.coinNote?'<small>'+o.coinNote+'</small>':'')+'<em>持有 '+save.coins.toLocaleString()+'</em></div>'+
    (o.notes||'')+'<p id="lbstatus" class="rlb"></p>'+(o.primary?'<button class="ibtn rmain" data-act="'+o.primary.act+'"'+(o.primary.arg!=null?' data-arg="'+o.primary.arg+'"':'')+'>'+o.primary.label+'</button>':'')+
    '<div class="rsec">'+o.sec.map(b=>'<button class="pbtn" data-act="'+b.act+'"'+(b.arg!=null?' data-arg="'+b.arg+'"':'')+'>'+b.label+'</button>').join('')+'</div></div>';}
Object.assign(ACTIONS,{loF:a=>{LOF=a;sfx('ui');renderLoadout();}});

requestAnimationFrame(loop);
</script>
