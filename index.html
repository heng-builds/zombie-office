<style>

  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --carpet:#1b1f2b; } }
:root[data-theme="dark"]{ --carpet:#1b1f2b; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--carpet);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--paper)}
.pix{font-family:"DotGothic16","Noto Sans TC",monospace}
#game{position:fixed;inset:0;display:block;image-rendering:pixelated;cursor:default}

#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;

.memo::before{content:"";position:absolute;top:-13px;left:50%;width:120px;height:26px;background:rgba(255,255,255,.5);transform:translateX(-50%) rotate(2.5deg)}
.memo h1{font-weight:900;font-size:clamp(36px,9vw,50px);line-height:1.02;margin:0 0 6px}
.memo h2{font-weight:900;font-size:30px;line-height:1.1;margin:0 0 10px}
.memo p{margin:0 0 12px;font-size:15px;line-height:1.55}
.memo .hint{margin:18px 0 0;font-size:13px;color:#4d4424}
.wallet{display:inline-flex;align-items:center;gap:8px;font-family:"DotGothic16",monospace;font-size:20px;margin:4px 0 6px}
.coin{display:inline-block;width:14px;height:14px;background:var(--postit);box-shadow:inset -3px -3px 0 #c99a12,0 0 0 2px var(--ink)}
.memo .coin{background:#fff3b0}

.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:18px;padding:12px 16px;margin:10px 0 0;background:var(--ink);color:var(--postit);
  border:0;box-shadow:4px 4px 0 rgba(0,0,0,.35);cursor:pointer;text-align:left}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.item:focus-visible,.floor:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{margin:0}

/* 公文夾：武器庫、更衣室、選槍 */
.sheet{background:var(--paper);color:var(--ink);width:min(680px,100%);padding:22px 20px 20px;box-shadow:7px 7px 0 rgba(0,0,0,.5);margin:auto;
  border-top:14px solid #6b7688}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sheet h2{margin:0;font-weight:900;font-size:26px}
.sheet .lead{margin:4px 0 14px;font-size:14px;color:var(--muted)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px 12px;background:#fff;border:2px solid var(--ink);
  font:inherit;color:inherit;text-align:left;width:100%}
button.item{cursor:pointer}
.item img{height:auto;image-rendering:pixelated;display:block;margin:0 auto;max-width:72px}
.item{position:relative}
.tier{display:inline-block;font-size:11px;font-weight:900;padding:1px 6px;margin-left:6px;vertical-align:2px;color:#fff;background:var(--tc)}
.t-rare{box-shadow:inset 0 0 0 3px #3a86ff}
.t-epic{box-shadow:inset 0 0 0 3px #9d4edd,0 0 14px rgba(157,78,221,.45);background:linear-gradient(135deg,#fff,#f3e8ff)}
.t-legend{box-shadow:inset 0 0 0 3px #ffb703,0 0 20px rgba(255,183,3,.6);background:linear-gradient(120deg,#fff8dc 0%,#fff 35%,#ffe8a3 50%,#fff 65%,#fff8dc 100%);background-size:250% 100%;animation:shine 3s linear infinite}
.t-legend img{filter:drop-shadow(0 0 6px rgba(255,46,99,.6))}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion: reduce){.t-legend{animation:none}}
.item h3{margin:0;font-size:17px;font-weight:900}
.item p{margin:3px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.item .stats{font-family:"DotGothic16",monospace;color:var(--ink)}
.item .btn{margin:0;width:auto;font-size:15px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.item .tag{font-size:14px;font-weight:900;white-space:nowrap}
.item.sel{outline:4px solid var(--postit);outline-offset:-1px}
.slotno{width:34px;height:34px;display:grid;place-items:center;font-family:"DotGothic16",monospace;font-size:20px;border:2px solid var(--ink);background:#fff}
.item.sel .slotno{background:var(--ink);color:var(--postit)}

/* 電梯面板：選關 */

  box-shadow:inset 0 0 0 3px #5c6677,7px 7px 0 rgba(0,0,0,.5)}
.elevator .display{background:#0d0f14;color:#ff6a3d;font-family:"DotGothic16",monospace;font-size:24px;text-align:center;padding:10px 8px;margin-bottom:6px;min-height:52px;
  box-shadow:inset 0 0 0 3px #3a414f;text-shadow:0 0 8px rgba(255,106,61,.7)}
.elevator .boss{font-size:13px;text-align:center;margin:0 0 16px;min-height:20px;font-weight:900}
.floors{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.floor{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:0}
.floor .dot{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:"DotGothic16",monospace;font-size:22px;
  background:radial-gradient(circle at 35% 30%,#f4f6fa,#bcc4d0);box-shadow:inset 0 0 0 4px #5c6677,0 3px 0 #4a5362}
.floor small{font-size:12px;font-weight:900;line-height:1.2;text-align:center}
.floor.cur .dot{background:radial-gradient(circle at 35% 30%,#fff8d8,#ffd23f);box-shadow:inset 0 0 0 4px #b58a00,0 0 16px rgba(255,210,63,.9)}
.floor.done .dot{color:#2d6a1f}

/* 觸控 */
#touch{position:fixed;inset:0;z-index:2;touch-action:none}
#touch.hidden,#pauseBtn.hidden{display:none}
.tbtn{position:fixed;font:inherit;font-weight:900;color:var(--ink);background:var(--postit);border:0;box-shadow:4px 4px 0 rgba(0,0,0,.45)}

const spriteCache=new Map();
function sprite(key,rows,pal){
  let s=spriteCache.get(key); if(s) return s;
  const h=rows.length,w=rows[0].length;
  const a=document.createElement('canvas'),b=document.createElement('canvas');
  a.width=b.width=w;a.height=b.height=h;
  const x=a.getContext('2d'),y=b.getContext('2d'); y.fillStyle='#ffffff';
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){const ch=rows[r][c];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(c,r,1,1);y.fillRect(c,r,1,1);}}
  s={img:a,white:b}; spriteCache.set(key,s); return s;
}
const charSprite=(palKey,frame,zombie)=>{
  if(!zombie&&palKey.startsWith('p_')){const a=OUTFIT_ART[palKey.slice(2)];return sprite(palKey+'_'+frame,a.rows.concat(a.legs[frame]),PAL[palKey]);}
  return sprite(palKey+'_'+frame+(zombie?'z':''),(zombie?ZBODY:BODY).concat(LEGS[frame]),PAL[palKey]);};
const gunSprite=id=>sprite('g_'+id,GUN_ART[id].rows,GUN_ART[id].pal);
const iconCache={};
function toIcon(key,img,scale){
  if(iconCache[key]) return iconCache[key];
  const c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,c.width,c.height);
  return iconCache[key]=c.toDataURL();
}
const gunIcon=id=>toIcon('g'+id,gunSprite(id).img,8);
const outfitIcon=id=>toIcon('o'+id,charSprite('p_'+id,0,false).img,6);

const SAVE_KEY='zombie-office-save-v1';
const DEFAULT_SAVE={coins:0,guns:['stapler','rubber'],outfits:['shirt'],outfit:'shirt',unlocked:0,cleared:[],loadout:['stapler','rubber'],settings:{autoFire:false,sound:true}};
function loadSave(){
  const d=JSON.parse(JSON.stringify(DEFAULT_SAVE));
  let s=null; try{s=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
  if(!s||typeof s!=='object') return d;
  const out={...d,...s,settings:{...d.settings,...(s.settings||{})}};
  out.coins=Math.max(0,Math.floor(+out.coins||0));
  out.guns=Array.from(new Set(['stapler','rubber',...(Array.isArray(out.guns)?out.guns:[])])).filter(id=>GUNS[id]);
  out.outfits=Array.from(new Set(['shirt',...(Array.isArray(out.outfits)?out.outfits:[])])).filter(id=>OUTFITS[id]);
  if(!out.outfits.includes(out.outfit)) out.outfit='shirt';
  out.unlocked=clamp(Math.floor(+out.unlocked||0),0,LEVELS.length-1);
  out.cleared=Array.isArray(out.cleared)?out.cleared.filter(n=>n>=0&&n<LEVELS.length):[];
  out.loadout=Array.isArray(out.loadout)?out.loadout.filter(id=>out.guns.includes(id)).slice(0,2):['stapler','rubber'];
  return out;
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
let save=loadSave();

/* ================= 音效 ================= */
let AC=null;const sfxLast={};
const SFX={shoot:[520,.05,'square',.02,45],hit:[190,.05,'square',.025,40],coin:[980,.07,'triangle',.035,45],hurt:[140,.2,'sawtooth',.06,120],
  boom:[80,.3,'sawtooth',.07,80],power:[620,.25,'triangle',.05,90],alarm:[300,.55,'square',.045,300],ui:[440,.06,'triangle',.035,30],kill:[250,.07,'square',.025,35]};
function sfx(n){
  if(!save.settings.sound) return;
  const c=SFX[n],now=performance.now(); if(!c||now-(sfxLast[n]||0)<c[4]) return; sfxLast[n]=now;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=c[2];o.frequency.setValueAtTime(c[0],t);
    if(n==='coin'||n==='power') o.frequency.exponentialRampToValueAtTime(c[0]*1.7,t+c[1]);
    if(n==='boom'||n==='hurt'||n==='alarm') o.frequency.exponentialRampToValueAtTime(c[0]*.5,t+c[1]);
    g.gain.setValueAtTime(c[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+c[1]);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+c[1]+.02);
  }catch(e){}
}

/* ================= 場景 ================= */
function genDesks(seed){
  const r=seeded(seed*977+13),d=[];
  for(let gx=0;gx<5;gx++)for(let gy=0;gy<4;gy++){
    const x=220+gx*300+Math.floor(r()*40-20),y=190+gy*270+Math.floor(r()*30-15);
    if(Math.abs(x+65-WORLD.w/2)<220&&Math.abs(y+26-WORLD.h/2)<170) continue;
    if(r()<.22) continue;
    d.push({x,y,w:130,h:52});
  }
  return d;
}
function inDesk(x,y,m,desks){for(const d of desks) if(x>d.x-m&&x<d.x+d.w+m&&y>d.y-m&&y<d.y+d.h+m) return true;return false;}
function pushOut(o,rad,desks){
  for(const d of desks){
    const cx=clamp(o.x,d.x,d.x+d.w),cy=clamp(o.y,d.y,d.y+d.h);
    let dx=o.x-cx,dy=o.y-cy;const d2=dx*dx+dy*dy;
    if(d2>=rad*rad) continue;
    if(d2===0){
      const l=o.x-d.x,rr=d.x+d.w-o.x,t=o.y-d.y,b=d.y+d.h-o.y,m=Math.min(l,rr,t,b);
      if(m===l)o.x=d.x-rad;else if(m===rr)o.x=d.x+d.w+rad;else if(m===t)o.y=d.y-rad;else o.y=d.y+d.h+rad;
    }else{const dist=Math.sqrt(d2),push=rad-dist;o.x+=dx/dist*push;o.y+=dy/dist*push;}
  }
}
const camFit=(v,world,view)=>view>=world?(world-view)/2:clamp(v,0,world-view);

window.addEventListener('keydown',e=>{
  keys[e.code]=true;

    else if(e.code==='Escape'||e.code==='KeyP') pauseGame();
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  }else if(mode==='paused'&&(e.code==='Escape'||e.code==='KeyP')) resumeGame();
});

window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});

const touchEl=$('#touch');
touchEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')) return;
  isTouch=true;
  if(!joy.active){joy.active=true;joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;try{touchEl.setPointerCapture(e.pointerId);}catch(_){}}
});
touchEl.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;}});

let mode='menu';let G=null;

function startRun(lv,loadout){
  const def=LEVELS[lv],o=OUTFITS[save.outfit].bonus;
  const st={dmg:1+(o.dmg||0),rate:1,spd:1+(o.spd||0),multi:0,pierce:0,magnet:1+(o.magnet||0),regen:o.regen||0,armor:o.armor||0,coin:1+(o.coin||0)};
  const maxHp=100+(o.hp||0);
  const p={x:WORLD.w/2,y:WORLD.h/2,r:14,hp:maxHp,maxHp,st,slots:loadout.map(id=>({id,lv:1})),active:0,cd:0,swapCd:0,invuln:1.2,shield:0,aim:0,face:1,moving:false,anim:0};
  G={lv,def,player:p,enemies:[],bullets:[],ebullets:[],pickups:[],parts:[],floats:[],toasts:[],desks:genDesks(lv+1),
     kills:0,spawned:0,spawnAcc:0,phase:'wave',boss:null,coins:0,time:0,shake:0,skills:{},ended:false,winT:0,dead:false,deadT:0,vacuum:false,
     cam:{x:0,y:0},banner:{text:def.floor+' '+def.name,sub:'擊倒 '+def.quota+' 隻殭屍同事，這層的魔王就會現身',t:2.8}};
  hideScreen();mode='play';controlsUI(true);
}

function toast(text,t=2.2){G.toasts.push({text,t,max:t});if(G.toasts.length>4)G.toasts.shift();}
function floatText(x,y,text,color,size=13){if(G.floats.length>90)G.floats.shift();G.floats.push({x,y,text,color,size,life:.8});}
function burst(x,y,color,n,sp=160,size=3){for(let i=0;i<n;i++){if(G.parts.length>450)G.parts.shift();const a=Math.random()*Math.PI*2,s=rand(sp*.3,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),max:.7,color,size});}}

function switchGun(){
  if(!G||G.dead||mode!=='play') return;const p=G.player;
  if(p.slots.length<2||p.swapCd>0) return;
  p.active=1-p.active;p.swapCd=.15;p.cd=Math.min(p.cd,.12);sfx('ui');
  toast('切換：'+GUNS[p.slots[p.active].id].name,.9);
}
function setSlot(i){if(G&&i<G.player.slots.length&&i!==G.player.active)switchGun();}

function spawnPos(){
  const p=G.player,vw=W/ZOOM,vh=H/ZOOM,R=Math.hypot(vw,vh)/2+40;
  for(let k=0;k<10;k++){
    const a=Math.random()*Math.PI*2;
    const x=clamp(p.x+Math.cos(a)*R,40,WORLD.w-40),y=clamp(p.y+Math.sin(a)*R,40,WORLD.h-40);
    if(Math.hypot(x-p.x,y-p.y)<260) continue;
    if(!inDesk(x,y,20,G.desks)) return {x,y};
  }
  return {x:rand(40,WORLD.w-40),y:p.y<WORLD.h/2?WORLD.h-40:40};
}
function pickType(mix){let r=Math.random(),acc=0;for(const [k,v] of Object.entries(mix)){acc+=v;if(r<=acc)return k;}return 'walker';}
function spawnEnemy(type,at,minion){
  const T=ETYPES[type],lv=G.lv,pos=at||spawnPos();
  const e={type,x:pos.x,y:pos.y,r:T.r,hp:T.hp*(1+lv*.35),speed:T.speed*(1+lv*.05)*rand(.9,1.1),dmg:T.dmg*(1+lv*.12),coin:T.coin,
    scale:T.scale,pal:type,flash:0,atk:rand(1,2.5),seed:Math.random()*10,anim:Math.random(),face:1,minion:!!minion};
  e.maxHp=e.hp;G.enemies.push(e);return e;
}
function startBoss(){
  const B=BOSSES[G.def.boss],p=G.player;G.phase='boss';
  const a=Math.random()*Math.PI*2;
  const b={type:'boss',boss:true,name:B.name,x:clamp(p.x+Math.cos(a)*430,90,WORLD.w-90),y:clamp(p.y+Math.sin(a)*430,90,WORLD.h-90),
    r:B.scale*12*.42,hp:B.hp,maxHp:B.hp,speed:B.speed,dmg:25,coin:0,scale:B.scale,pal:'boss_'+G.def.boss,flash:0,
    patterns:B.patterns,pi:0,pcd:2.2,words:B.words,spiral:0,spAcc:0,spAng:0,dash:null,boost:0,anim:0,face:1,seed:0};
  G.enemies.push(b);G.boss=b;G.banner={text:'⚠ '+B.name+' 出現了',sub:B.line,t:2.8};G.shake=12;sfx('alarm');
  burst(b.x,b.y,'#e2443b',40,300,4);
}

/* ---------- 射擊 ---------- */
function fire(){
  const p=G.player,s=p.slots[p.active],g=GUNS[s.id],st=p.st;
  const lvMul=1+.25*(s.lv-1),n=g.pellets+st.multi,fan=g.fan||.12;
  const reach=gunSprite(s.id).img.width*2.2+4,ox=p.x+Math.cos(p.aim)*reach,oy=p.y+2+Math.sin(p.aim)*reach;p.flashT=.05;
  for(let i=0;i<n;i++){
    const a=p.aim+(n>1?(i-(n-1)/2)*fan:0)+rand(-g.spread,g.spread);
    G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*g.speed,vy:Math.sin(a)*g.speed,dmg:g.dmg*lvMul*st.dmg,pierce:g.pierce+st.pierce,
      life:g.life,size:g.size,color:g.color,explode:g.explode||0,kind:g.kind||'',glow:GUN_ART[s.id].glow||null,confetti:s.id==='shredder',hit:new Set()});
  }
  p.cd=g.rate/st.rate;sfx('shoot');
}
function hurt(e,dmg){
  if(e.dead) return;e.hp-=dmg;e.flash=.07;
  if(dmg>=12||Math.random()<.3) floatText(e.x+rand(-8,8),e.y-e.r-8,Math.round(dmg),e.boss?'#ffd23f':'#ffffff',e.boss?15:12);
  if(e.hp<=0){e.dead=true;onKill(e);}else sfx('hit');
}
function explode(x,y,rad,dmg){
  for(const e of G.enemies){const d=Math.hypot(e.x-x,e.y-y);if(d<rad+e.r)hurt(e,dmg*(1-.4*Math.min(1,d/rad)));}
  burst(x,y,'#ffffff',18,260,4);burst(x,y,'#ffb703',16,220,4);G.shake=Math.max(G.shake,7);sfx('boom');
}
function dropCoins(x,y,count,value){for(let i=0;i<count;i++)G.pickups.push({type:'coin',x:x+rand(-10,10),y:y+rand(-10,10),vx:rand(-90,90),vy:rand(-90,90),value,life:25});}
function onKill(e){
  sfx('kill');
  if(e.boss){
    burst(e.x,e.y,'#8fd14f',70,380,5);burst(e.x,e.y,'#ffd23f',50,320,4);G.shake=16;
    dropCoins(e.x,e.y,36,3);G.phase='done';G.winT=2.6;G.vacuum=true;
    for(const o of G.enemies) if(!o.dead&&!o.boss){o.dead=true;burst(o.x,o.y,'#8fd14f',8);}

    G.banner={text:e.name+' 被打下班了',sub:'撿金幣中…',t:2.4};sfx('power');
    return;
  }

    if(r<.035)G.pickups.push({type:'skill',x:e.x,y:e.y,id:pick(Object.keys(SKILLS)),life:20});
    else if(r<.05)G.pickups.push({type:'gun',x:e.x,y:e.y,life:20});
    else if(r<.08)G.pickups.push({type:'heal',x:e.x,y:e.y,life:20});

}
function eshoot(src,a,speed,opt={}){
  if(G.ebullets.length>260) return;
  G.ebullets.push({x:src.x+Math.cos(a)*src.r*.6,y:src.y+Math.sin(a)*src.r*.6,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
    dmg:opt.dmg||12,life:opt.life||4,r:opt.r||7,homing:!!opt.homing,label:opt.label||null});
}
function damagePlayer(d){
  const p=G.player;if(p.invuln>0||G.dead||G.phase==='done') return;
  if(p.shield>0){p.shield--;p.invuln=.8;floatText(p.x,p.y-30,'特休擋下！','#7bdff2',14);sfx('power');return;}
  d*=1-p.st.armor;p.hp-=d;p.invuln=.55;G.shake=Math.max(G.shake,6);sfx('hurt');burst(p.x,p.y,'#e2443b',8,150,3);
  if(p.hp<=0){p.hp=0;G.dead=true;G.deadT=1.4;burst(p.x,p.y,'#e2443b',40,260,4);G.banner={text:'你被加班吞噬了',sub:'',t:1.6};}
}

/* ---------- 魔王 ---------- */
function bossAI(b,dt){
  const p=G.player,dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1,angry=b.hp<b.maxHp*.5;
  if(b.dash){
    if(b.dash.wind>0)b.dash.wind-=dt;
    else{b.x+=b.dash.vx*dt;b.y+=b.dash.vy*dt;b.dash.t-=dt;if(b.dash.t<=0)b.dash=null;}
  }else{
    const sp=b.speed*(angry?1.25:1)*(b.boost>0?1.9:1);b.boost-=dt;
    if(d>b.r+p.r){b.x+=dx/d*sp*dt;b.y+=dy/d*sp*dt;}
  }
  b.x=clamp(b.x,b.r,WORLD.w-b.r);b.y=clamp(b.y,b.r,WORLD.h-b.r);
  if(b.spiral>0){
    b.spiral-=dt;b.spAcc+=dt;
    while(b.spAcc>.075){b.spAcc-=.075;b.spAng+=.38;eshoot(b,b.spAng,190,{label:Math.random()<.15?pick(b.words):null});eshoot(b,b.spAng+Math.PI,190);}
  }
  b.pcd-=dt;
  if(b.pcd<=0&&!b.dash){
    const pat=b.patterns[b.pi++%b.patterns.length],base=Math.atan2(dy,dx);
    if(pat==='burst'){const n=angry?20:14;for(let i=0;i<n;i++)eshoot(b,i/n*Math.PI*2+b.pi*.2,210,{label:i%4===0?pick(b.words):null});}
    else if(pat==='spread'){const n=angry?9:7;for(let i=0;i<n;i++)eshoot(b,base+(i-(n-1)/2)*.15,290,{label:i===(n-1)/2?pick(b.words):null});}
    else if(pat==='dash'){b.dash={wind:.65,t:.55,vx:dx/d*580,vy:dy/d*580};}
    else if(pat==='homing'){for(const o of [-.7,0,.7])eshoot(b,base+o,175,{homing:true,life:4.5,r:9,dmg:14,label:pick(b.words)});}
    else if(pat==='spiral'){b.spiral=1.7;}
    else if(pat==='summon'){const n=angry?6:4;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;spawnEnemy(Math.random()<.5?'runner':'walker',{x:clamp(b.x+Math.cos(a)*80,40,WORLD.w-40),y:clamp(b.y+Math.sin(a)*80,40,WORLD.h-40)},true);}burst(b.x,b.y,'#8fd14f',24,260,4);}
    else if(pat==='chase'){b.boost=1.4;}
    b.pcd=angry?1.5:2.3;
  }
}

/* ---------- 主更新 ---------- */
function update(dt){
  const g=G,p=g.player;g.time+=dt;
  // 玩家移動
  let mx=0,my=0;
  if(!g.dead){
    if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
    if(joy.active){const jx=(joy.x-joy.ox)/55,jy=(joy.y-joy.oy)/55;if(Math.hypot(jx,jy)>.15){mx=jx;my=jy;}}
    const len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len;}
    const sp=210*p.st.spd;p.x+=mx*sp*dt;p.y+=my*sp*dt;
    p.x=clamp(p.x,p.r+24,WORLD.w-p.r-24);p.y=clamp(p.y,p.r+24,WORLD.h-p.r-24);pushOut(p,p.r,g.desks);
    p.moving=len>.1;if(p.moving)p.anim+=dt;
    if(p.st.regen>0&&p.hp<p.maxHp)p.hp=Math.min(p.maxHp,p.hp+p.st.regen*dt);
  }
  p.invuln-=dt;p.swapCd-=dt;p.cd-=dt;p.flashT=(p.flashT||0)-dt;
  const oaT=OUTFIT_ART[save.outfit].tier;
  if(oaT==='legend'&&!g.dead&&Math.random()<dt*14&&g.parts.length<440)g.parts.push({x:p.x+rand(-18,18),y:p.y+rand(-30,14),vx:rand(-10,10),vy:rand(-50,-20),life:.6,max:.6,color:Math.random()<.5?'#ffd23f':'#fff8dc',size:3});
  if(GUN_ART[p.slots[p.active].id].tier==='legend'&&!g.dead&&Math.random()<dt*8&&g.parts.length<440){const r=gunSprite(p.slots[p.active].id).img.width*2.2*Math.random();g.parts.push({x:p.x+Math.cos(p.aim)*r,y:p.y+2+Math.sin(p.aim)*r,vx:rand(-20,20),vy:rand(-20,20),life:.4,max:.4,color:'#ff2e63',size:2});}
  // 瞄準與射擊
  if(!g.dead&&g.phase!=='done'){
    // 全自動：瞄準最近的敵人，範圍內有敵人就開火（Boss 在範圍內時優先）
    let firing=false,best=null,bd=640*640;
    for(const e of g.enemies){if(e.dead)continue;const d2=(e.x-p.x)**2+(e.y-p.y)**2;if(d2<bd){bd=d2;best=e;}}
    if(g.boss&&!g.boss.dead&&(g.boss.x-p.x)**2+(g.boss.y-p.y)**2<360*360&&(!best||bd>90*90))best=g.boss;
    if(best){p.aim=Math.atan2(best.y-p.y,best.x-p.x);firing=true;}
    else if(p.moving)p.aim=Math.atan2(my,mx);
    p.face=Math.cos(p.aim)>=0?1:-1;
    if(firing&&p.cd<=0)fire();
  }
  // 生怪
  const alive=g.enemies.filter(e=>!e.boss&&!e.dead).length,def=g.def;
  if(g.phase==='wave'){
    if(g.spawned<def.quota){
      g.spawnAcc=Math.min(4,g.spawnAcc+dt*def.rate*(1+g.time/80));
      while(g.spawnAcc>=1&&alive+0<def.max&&g.spawned<def.quota){g.spawnAcc-=1;spawnEnemy(pickType(def.mix));g.spawned++;}
    }
    if(g.kills>=def.quota)startBoss();
  }else if(g.phase==='boss'){
    g.spawnAcc=Math.min(3,g.spawnAcc+dt*def.rate*.3);
    while(g.spawnAcc>=1&&alive<def.max*.45){g.spawnAcc-=1;spawnEnemy(pickType(def.mix));}
  }
  // 敵人
  for(const e of g.enemies){
    if(e.dead)continue;e.flash-=dt;e.anim+=dt;
    if(e.boss){bossAI(e,dt);}
    else{
      const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
      let a=Math.atan2(dy,dx)+Math.sin(g.time*2+e.seed)*.35,sp=e.speed;
      if(e.type==='thrower'){
        if(d<200)a+=Math.PI;else if(d<280){a+=Math.PI/2;sp*=.6;}
        e.atk-=dt;if(e.atk<=0&&d<540&&!g.dead){eshoot(e,Math.atan2(dy,dx),240,{dmg:10*(1+g.lv*.12),label:Math.random()<.5?pick(['文件','報告','急件','會議']):null});e.atk=rand(2,2.8);}
      }
      e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;
      e.x=clamp(e.x,30,WORLD.w-30);e.y=clamp(e.y,30,WORLD.h-30);pushOut(e,e.r*.8,g.desks);
    }
    e.face=p.x>=e.x?1:-1;
    const cd=Math.hypot(p.x-e.x,p.y-e.y);
    if(cd<e.r+p.r-4){damagePlayer(e.dmg);if(!e.boss){const k=(e.r+p.r-cd)+6;e.x-=(p.x-e.x)/(cd||1)*k;e.y-=(p.y-e.y)/(cd||1)*k;}}
  }
  // 互相推開
  const es=g.enemies;
  for(let i=0;i<es.length;i++){const a=es[i];if(a.dead)continue;
    for(let j=i+1;j<es.length;j++){const b=es[j];if(b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,rr=(a.r+b.r)*.8,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>0){const d=Math.sqrt(d2),o=(rr-d);const ux=dx/d,uy=dy/d;
        if(a.boss){b.x+=ux*o;b.y+=uy*o;}else if(b.boss){a.x-=ux*o;a.y-=uy*o;}
        else{a.x-=ux*o/2;a.y-=uy*o/2;b.x+=ux*o/2;b.y+=uy*o/2;}}
    }}
  // 子彈
  for(const b of g.bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.x<0||b.y<0||b.x>WORLD.w||b.y>WORLD.h){b.life=0;continue;}
    for(const e of g.enemies){
      if(e.dead||b.hit.has(e)||b.life<=0)continue;
      const rr=e.r+b.size;if((e.x-b.x)**2+(e.y-b.y)**2>rr*rr)continue;
      if(b.explode){explode(b.x,b.y,b.explode,b.dmg);b.life=0;break;}
      hurt(e,b.dmg);b.hit.add(e);
      if(!e.boss){e.x+=b.vx*.012;e.y+=b.vy*.012;}
      if(b.pierce--<=0){b.life=0;break;}
    }
  }
  g.bullets=g.bullets.filter(b=>b.life>0);
  // 敵方子彈
  for(const b of g.ebullets){
    if(b.homing&&!g.dead){const want=Math.atan2(p.y-b.y,p.x-b.x),cur=Math.atan2(b.vy,b.vx);let df=want-cur;
      while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
      const na=cur+clamp(df,-1.9*dt,1.9*dt),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.x<-20||b.y<-20||b.x>WORLD.w+20||b.y>WORLD.h+20)b.life=0;
    const rr=b.r+p.r*.7;if(b.life>0&&(b.x-p.x)**2+(b.y-p.y)**2<rr*rr){damagePlayer(b.dmg);b.life=0;}
  }
  g.ebullets=g.ebullets.filter(b=>b.life>0);
  g.enemies=g.enemies.filter(e=>!e.dead);
  if(g.boss&&g.boss.dead)g.boss=null;
  // 撿東西
  const mag=g.vacuum?4000:70*p.st.magnet;
  for(const it of g.pickups){
    it.life-=dt;
    if(it.vx){it.x+=it.vx*dt;it.y+=it.vy*dt;it.vx*=.9;it.vy*=.9;if(Math.abs(it.vx)<2)it.vx=0;}
    const dx=p.x-it.x,dy=p.y-it.y,d=Math.hypot(dx,dy)||1;
    const r=it.type==='coin'?mag:Math.max(46,mag*.5);
    if(d<r&&!g.dead){const s=g.vacuum?700:420;it.x+=dx/d*s*dt;it.y+=dy/d*s*dt;}
    if(d<p.r+10&&!g.dead){it.life=0;collect(it);}
  }
  g.pickups=g.pickups.filter(i=>i.life>0);
  // 特效
  for(const q of g.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;q.life-=dt;}
  g.parts=g.parts.filter(q=>q.life>0);
  for(const f of g.floats){f.y-=40*dt;f.life-=dt;}
  g.floats=g.floats.filter(f=>f.life>0);
  for(const t of g.toasts)t.t-=dt;g.toasts=g.toasts.filter(t=>t.t>0);
  if(g.banner)g.banner.t-=dt;
  g.shake=Math.max(0,g.shake-dt*30);
  // 結束
  if(g.winT>0){g.winT-=dt;if(g.winT<=0)endRun(true);}
  if(g.dead){g.deadT-=dt;if(g.deadT<=0)endRun(false);}
}
function collect(it){
  const g=G,p=g.player;
  if(it.type==='coin'){g.coins+=it.value*p.st.coin;sfx('coin');}
  else if(it.type==='heal'){p.hp=Math.min(p.maxHp,p.hp+30);floatText(p.x,p.y-30,'+30 便當','#8fd14f',14);sfx('power');}
  else if(it.type==='skill'){const s=SKILLS[it.id];s.apply(p);g.skills[it.id]=(g.skills[it.id]||0)+1;toast(s.icon+' '+s.name+'：'+s.desc);sfx('power');}
  else if(it.type==='gun'){
    const id=pick(save.guns),idx=p.slots.findIndex(s=>s.id===id);
    if(idx>=0){const s=p.slots[idx];if(s.lv<5){s.lv++;toast(GUNS[id].name+' 升級到 Lv'+s.lv);}else{g.coins+=20;toast(GUNS[id].name+' 已滿級，換成 20 金幣');}}
    else{const old=p.slots[p.active];p.slots[p.active]={id,lv:1};toast('撿到 '+GUNS[id].name+'（換掉 '+GUNS[old.id].name+'）');}
    sfx('power');
  }
}

function drawFloor(cam,vw,vh,fa,fb){

  ctx.fillStyle='#4b5366';ctx.fillRect(0,0,WORLD.w,24);ctx.fillRect(0,WORLD.h-24,WORLD.w,24);ctx.fillRect(0,0,24,WORLD.h);ctx.fillRect(WORLD.w-24,0,24,WORLD.h);

function drawChar(spr,x,y,scale,face,flash,alpha){
  const img=flash?spr.white:spr.img,w=img.width*scale,h=img.height*scale;
  const bottom=14*scale*.38;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y+bottom-2,w*.32,w*.1,0,0,Math.PI*2);ctx.fill();
  ctx.save();if(alpha<1)ctx.globalAlpha=alpha;ctx.translate(Math.round(x),Math.round(y));ctx.scale(face,1);
  ctx.drawImage(img,-w/2,bottom-h,w,h);ctx.restore();

function drawEnemy(e){

  }
}
function drawPlayer(p){
  if(G.dead) return;
  const alpha=p.invuln>0&&Math.floor(G.time*20)%2?.45:1;
  const fr=p.moving?Math.floor(p.anim*8)%2:0;
  const oa=OUTFIT_ART[save.outfit];
  if(oa.aura){const pulse=.5+.5*Math.sin(G.time*4),gr=ctx.createRadialGradient(p.x,p.y,4,p.x,p.y,oa.tier==='legend'?46:36);
    gr.addColorStop(0,oa.aura+(oa.tier==='legend'?'aa':'66'));gr.addColorStop(1,oa.aura+'00');ctx.globalAlpha=.6+.4*pulse;ctx.fillStyle=gr;
    ctx.beginPath();ctx.arc(p.x,p.y,oa.tier==='legend'?46:36,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  drawChar(charSprite('p_'+save.outfit,fr,false),p.x,p.y+(p.moving?Math.sin(p.anim*16)*1.5:0),3,p.face,false,alpha);
  const gid=p.slots[p.active].id,ga=GUN_ART[gid],gs=gunSprite(gid),gw=gs.img.width*2.2,gh=gs.img.height*2.2;
  ctx.save();ctx.translate(p.x,p.y+2);ctx.rotate(p.aim);if(Math.cos(p.aim)<0)ctx.scale(1,-1);

function render(){

  const title=quit?'提早下班':win?(final?'全公司都下班了':'成功下班！'):'被加班吞噬了';
  const msg=final?'董事長也被你打下班了。整棟樓終於安靜下來。':win?'這層清乾淨了，'+LEVELS[lv+1].floor+' 已經解鎖。':quit?'今天的進度重置，賺到的金幣已經收進口袋。':'關卡會重置，但買過的槍和衣服都還在。';
  show('<div class="memo" role="dialog" aria-label="結算"><h1>'+title+'</h1><p>'+L.floor+' '+esc(L.name)+'　擊倒 '+G.kills+' 隻</p><p>'+msg+'</p>'+
    '<p class="pix" style="font-size:18px;margin:0">本局金幣 +'+earned+(bonus?'（含通關獎金 '+bonus+'）':'')+'</p>'+coinTag(save.coins)+
    (hasNext?'<button class="btn" data-act="pickLevel" data-arg="'+(lv+1)+'">前往 '+LEVELS[lv+1].floor+' '+esc(LEVELS[lv+1].name)+'</button>':'')+
    '<button class="btn'+(hasNext?' ghost':'')+'" data-act="retry">再打一次 '+L.floor+'</button>'+
    '<button class="btn ghost" data-act="shop">去武器庫</button>'+
    '<button class="btn ghost" data-act="menu">回主選單</button></div>');
}
const ACTIONS={
  menu:renderMenu,levels:()=>{G=null;renderLevels();},
  shop:()=>{G=null;mode='menu';renderShop();},wardrobe:()=>renderWardrobe(),settings:()=>{resetArm=false;renderSettings();},
  pickLevel:a=>{G=null;mode='menu';pendingLv=+a;pickSel=save.loadout.filter(id=>save.guns.includes(id)).slice(0,2);
    for(const id of save.guns){if(pickSel.length>=2)break;if(!pickSel.includes(id))pickSel.push(id);}renderLoadout();},
  toggleGun:a=>{const k=pickSel.indexOf(a);if(k>=0)pickSel.splice(k,1);else if(pickSel.length<2)pickSel.push(a);else pickSel[1]=a;renderLoadout(a);},
  start:()=>{if(pickSel.length<2)return;save.loadout=pickSel.slice();persist();startRun(pendingLv,pickSel.slice());},
  buyGun:a=>{const g=GUNS[a];if(!g||save.guns.includes(a)||save.coins<g.price)return;save.coins-=g.price;save.guns.push(a);persist();sfx('power');renderShop(a);},
  buyOutfit:a=>{const o=OUTFITS[a];if(!o||save.outfits.includes(a)||save.coins<o.price)return;save.coins-=o.price;save.outfits.push(a);save.outfit=a;persist();sfx('power');renderWardrobe(a);},
  wear:a=>{if(!save.outfits.includes(a))return;save.outfit=a;persist();renderWardrobe(a);},
    toggleSound:()=>{save.settings.sound=!save.settings.sound;persist();renderSettings();},
  reset:()=>{if(!resetArm){resetArm=true;renderSettings();scr.querySelector('[data-act="reset"]').focus();return;}
    try{localStorage.removeItem(SAVE_KEY);}catch(e){}save=loadSave();resetArm=false;renderMenu();},
  resume:resumeGame,quit:()=>endRun(false,true),
  retry:()=>{const lv=G?G.lv:pendingLv;const lo=save.loadout.length===2?save.loadout.slice():pickSel.slice();G=null;
    if(lo.length<2){ACTIONS.pickLevel(lv);return;}startRun(lv,lo);},
};
scr.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;sfx('ui');ACTIONS[b.dataset.act]&&ACTIONS[b.dataset.act](b.dataset.arg);});

renderMenu();requestAnimationFrame(loop);
</script>
</body>
</html>
